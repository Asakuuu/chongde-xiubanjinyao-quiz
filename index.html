<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修辦津要題庫測驗</title>
    <style>
        /* --- 中式古風 / 紙張質感設計 --- */
        body {
            background-color: #e8e2d5; 
            color: #2a201b; 
            font-family: "Noto Serif TC", "Songti TC", "Songti", serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background-color: #faf8f5; 
            background-image: 
                linear-gradient(90deg, rgba(232,226,213,0.15) 1px, transparent 1px),
                linear-gradient(rgba(232,226,213,0.15) 1px, transparent 1px),
                radial-gradient(rgba(42,32,27,0.02) 1px, transparent 1px);
            background-size: 20px 20px, 20px 20px, 6px 6px;
            border: 1px solid #b8a68d;
            outline: 4px double #8c2626;
            outline-offset: -10px;
            padding: 45px 35px;
            box-shadow: 0 12px 35px rgba(42, 32, 27, 0.15);
            border-radius: 2px;
            text-align: center;
            position: relative;
            transition: outline-color 0.2s ease, box-shadow 0.2s ease;
        }

        .container::before, .container::after {
            content: "❖";
            color: #8c2626;
            font-size: 0.9rem;
            position: absolute;
            top: 14px;
            z-index: 2;
        }
        .container::before { left: 16px; }
        .container::after { right: 16px; }

        .corner-bottom-left, .corner-bottom-right {
            content: "❖";
            color: #8c2626;
            font-size: 0.9rem;
            position: absolute;
            bottom: 14px;
            z-index: 2;
        }
        .corner-bottom-left { left: 16px; }
        .corner-bottom-right { right: 16px; }

        h1 {
            color: #8c2626; 
            font-size: 2.3rem;
            margin-top: 10px;
            margin-bottom: 20px;
            letter-spacing: 5px;
            font-weight: bold;
        }

        .title-line {
            width: 60%;
            height: 1px;
            background: linear-gradient(to right, transparent, #8c2626, transparent);
            margin: 0 auto 25px auto;
        }

        h2 {
            font-size: 1.15rem;
            color: #1a365d; 
            margin-bottom: 35px;
            font-weight: normal;
            letter-spacing: 3px;
        }

        .section { 
            display: none; 
            animation: fadeIn 0.4s ease-in-out;
        }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        .shake-effect {
            animation: shake 0.3s ease-in-out;
        }

        .progress-wrapper {
            width: 80%;
            margin: 0 auto 25px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .progress-bar-outer {
            width: 100%;
            height: 6px;
            background-color: #ede6da;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #dcd1be;
            margin-top: 8px;
        }
        .progress-bar-inner {
            width: 0%;
            height: 100%;
            background-color: #4a5d4c; 
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        label {
            font-size: 1.05rem;
            font-weight: bold;
            display: block;
            margin-top: 25px;
            margin-bottom: 12px;
            color: #5d5249;
            letter-spacing: 2px;
        }

        button {
            background-color: #f3ede2;
            color: #5d5249;
            border: 1px solid #cbd2cb;
            border-bottom: 2px solid #b8a68d;
            padding: 11px 24px;
            font-size: 1rem;
            cursor: pointer;
            margin: 6px;
            border-radius: 3px;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #eaddca;
            color: #2a201b;
            border-color: #9c8b74;
        }

        button.selected-btn {
            background-color: #1a365d;
            color: #ffffff;
            border-color: #0f2441;
            border-bottom: 2px solid #0b1a30;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        button.selected-bonus-btn {
            background-color: #d4a373 !important;
            color: #ffffff !important;
            border-color: #bc8a5f !important;
            border-bottom: 2px solid #a06e46 !important;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        button:disabled {
            background-color: #e5dfd5 !important;
            color: #b0a79d !important;
            border-color: #d2c9bc !important;
            border-bottom-width: 1px !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
            opacity: 0.5;
        }

        .start-btn {
            background-color: #8c2626;
            color: #f4f0ea;
            border: 1px solid #6b1d1d;
            border-bottom: 3px solid #521313;
            font-size: 1.2rem;
            padding: 14px 60px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-top: 15px;
        }
        .start-btn:hover {
            background-color: #a63232;
            color: #ffffff;
            border-color: #8c2626;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 15px 22px;
            margin: 14px 0;
            background-color: #f5efe4;
            color: #2c2520;
            border: 1px solid #dcd1be;
            border-left: 4px solid #b8a68d;
            font-size: 1.05rem;
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background-color: #1a365d;
            color: #faf7f2;
            border-color: #102543;
            border-left-color: #4a7bb0;
        }

        input[type="text"] {
            width: 85%;
            padding: 14px;
            font-size: 1.15rem;
            border: 1px solid #b8a68d;
            background-color: #fffdfa;
            border-radius: 2px;
            margin-bottom: 25px;
            text-align: center;
            font-family: inherit;
            color: #2c2520;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #8c2626;
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(140, 38, 38, 0.15), inset 0 1px 3px rgba(0,0,0,0.05);
        }

        /* --- 進度看板 --- */
        .dashboard-classic {
            border: 1px solid #cbd2cb;
            outline: 1px dashed #b8a68d;
            outline-offset: -5px;
            padding: 20px;
            margin-top: 35px;
            background: #fffdfa;
            border-radius: 2px;
        }
        .db-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
            color: #5d5249;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .db-header-title {
            color: #8c2626;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .view-detail-btn {
            background-color: #f3ede2;
            color: #5d5249;
            border: 1px solid #cbd2cb;
            border-bottom: 2px solid #b8a68d;
            padding: 6px 14px;
            font-size: 0.85rem;
            margin: 0;
            border-radius: 3px;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            display: inline-block;
            vertical-align: middle;
        }
        .view-detail-btn:hover {
            background-color: #eaddca;
            color: #2a201b;
            border-color: #9c8b74;
        }

        /* --- 檢索與軌跡頁面 --- */
        .big-grid-box {
            border: 1px solid #cbd2cb;
            outline: 1px dashed #b8a68d;
            outline-offset: -5px;
            padding: 16px 20px;
            background: #fffdfa;
            text-align: left;
            margin-bottom: 20px;
        }
        .grid-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .grid-legend-inline {
            font-size: 11px; 
            color: #776c60;
            font-weight: normal;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 3px;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 3px;
            margin-top: 8px;
        }
        .grid-dot {
            aspect-ratio: 1;
            background-color: #e0dcd3;
            border-radius: 1px;
            font-size: 8px;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .grid-dot:hover {
            color: #fff;
            font-weight: bold;
            background-color: #a69a88 !important;
        }
        .dot-unvisited { background-color: #e0dcd3; }
        .dot-correct { background-color: #4a5d4c !important; }
        .dot-wrong { background-color: #a63232 !important; }

        .all-questions-inspect-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #b8a68d;
            padding: 15px;
            background: #faf8f5;
            border-radius: 2px;
            scroll-behavior: smooth;
        }
        .inspect-card {
            padding: 14px;
            margin-bottom: 12px;
            background-color: #ffffff;
            border-radius: 3px;
            line-height: 1.6;
            font-size: 0.95rem;
            transition: background-color 0.4s ease;
        }
        .inspect-card:last-child {
            margin-bottom: 0;
        }
        .card-unvisited { border: 1px solid #e0dcd3; border-left: 5px solid #d4ceb8; }
        .card-correct { border: 1px solid #d1ded3; border-left: 5px solid #4a5d4c; }
        .card-wrong { border: 1px solid #f2dede; border-left: 5px solid #a63232; }

        .inspect-answer-zone {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #f3ede2;
            border-top: 1px dashed #cbd2cb;
            color: #8c2626;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 1px;
        }

        .review-container {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #b8a68d;
            outline: 1px dashed #8c2626;
            outline-offset: -4px;
            padding: 15px 20px;
            margin: 25px 0;
            background: #fffdfa;
            text-align: left;
        }

        .review-item {
            padding: 12px 5px;
            border-bottom: 1px dashed #eaddca;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .review-item:last-child { border-bottom: none; }
        .review-item.correct-item { color: #2a6f2d; }
        .review-item.wrong-item { color: #b22222; }

        .filter-btn-group { margin-bottom: 15px; }
        .filter-btn {
            background-color: #b8a68d;
            color: #fff;
            padding: 6px 16px;
            font-size: 0.85rem;
            border: none;
            border-radius: 2px;
        }
        .filter-btn.active-filter {
            background-color: #1a365d;
        }

        hr { border: 0; border-top: 1px dashed #cbd2cb; margin: 25px 0; }
        @media screen and (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 25px 15px; }
            h1 { font-size: 1.6rem !important; letter-spacing: 2px !important; }

            .db-header {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
            }
            #db-ratio { 
                font-size: 0.85rem; 
                white-space: nowrap;
            }
            .db-header > div {
                margin-left: auto;
                margin-top: 4px;
            }
            .view-detail-btn { 
                padding: 6px 12px; 
                font-size: 0.8rem; 
                margin: 0; 
            }

            .grid-header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .grid-container {
                grid-template-columns: repeat(8, 1fr) !important;
                gap: 5px;
                max-height: 220px;
            }
            .grid-dot {
                font-size: 10px;
            }

            .option-btn { font-size: 0.95rem; padding: 12px 15px; }

            button {
                -webkit-tap-highlight-color: transparent;
            }
            button:focus {
                outline: none;
            }
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="corner-bottom-left">❖</div>
    <div class="corner-bottom-right">❖</div>
    
    <div id="screen-main" class="section active">
        <h1>修辦津要題庫測驗</h1>
        <div class="title-line"></div>
        <h2>溫故知新，精進修辦資糧</h2>

        <label>【 測驗模式 】</label>
        <div class="btn-group">
            <button type="button" id="mode-choice" onclick="selectMode('choice')">選擇題</button>
            <button type="button" id="mode-fill" onclick="selectMode('fill')">填空題</button>
        </div>

        <label>【 測驗題數 】</label>
        <div class="btn-group">
            <button type="button" id="num-15" onclick="selectCount(15)">15 題</button>
            <button type="button" id="num-30" onclick="selectCount(30)">30 題</button>
            <button type="button" id="num-50" onclick="selectCount(50)">50 題</button>
        </div>

        <label>【 精進選擇 】</label>
        <div class="btn-group">
            <button type="button" id="bonus-unvisited" onclick="selectBonus('unvisited')">優先未出題</button>
            <button type="button" id="bonus-review" onclick="selectBonus('review')">錯題複習 (0題)</button>
        </div>

        <hr>
        <button class="start-btn" onclick="startGame()">開始測驗</button>

        <div class="dashboard-classic">
            <div class="db-header">
                <span class="db-header-title">❖ 400 題完整修辦挑戰進度</span>
                <div style="display: flex; align-items: center;">
                    <span id="db-ratio" style="margin-right: 12px; font-size: 0.95rem;">已挑戰: 0 / 400 題 (0%)</span>
                    <button type="button" class="view-detail-btn" onclick="goToInspectPage()">查看全題</button>
                </div>
            </div>
            <div class="progress-bar-outer" style="margin-top: 4px; height: 8px; background-color: #f0eae1; border: 1px solid #dfd5c6;">
                <div class="progress-bar-inner" id="db-progress-bar" style="background-color: #4a5d4c;"></div>
            </div>
        </div>
    </div>

    <div id="screen-inspect" class="section">
        <h1 style="font-size: 2rem;">修班津要題庫進度</h1>
        <div class="title-line" style="width: 160px; margin-bottom: 20px;"></div>
        
        <div class="big-grid-box">
            <div class="grid-header-row">
                <div style="font-weight: bold; color: #8c2626; font-size: 1.05rem;">❖ 全局攻克軌跡</div>
                <div class="grid-legend-inline">綠色=已攻克 ｜ 紅色=待複習 ｜ 灰色=未出題</div>
                <div style="font-size: 11px; color: #1a365d; font-weight: bold; letter-spacing: 1px;">點擊框格快速瀏覽</div>
            </div>            
            <div class="grid-container" id="inspect-dots-container"></div>
        </div>

        <h3 style="text-align: left; margin-bottom: 10px; color: #1a365d; letter-spacing: 1px;">❖ 完整 400 題卷檢索</h3>
        <div class="all-questions-inspect-list" id="inspect-scroll-list"></div>

        <button onclick="leaveInspectPage()" style="margin-top: 20px; background-color: #b8a68d; border-color: #a49279; border-bottom-color: #8a7a63; color: #fff; padding: 10px 40px;">返回主畫面</button>
    </div>

    <div id="screen-game" class="section">
        <h1 style="font-size: 1.5rem;" id="game-title">修辦津要題庫測驗</h1>
        <div class="title-line" style="width: 40px; margin-bottom: 15px;"></div>
        
        <div class="progress-wrapper">
            <h2 id="question-number" style="margin-bottom: 0;">第 1 / X 題</h2>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progress-indicator"></div>
            </div>
        </div>

        <p id="question-text" style="font-size: 1.25rem; line-height: 1.7; font-weight: bold; margin: 25px 0; text-align: left; padding: 0 10px; color: #231a15; white-space: pre-line;"></p>
        
        <div id="area-choice" style="display: none;">
            <button class="option-btn" onclick="submitChoice(0)" id="opt-0"></button>
            <button class="option-btn" onclick="submitChoice(1)" id="opt-1"></button>
            <button class="option-btn" onclick="submitChoice(2)" id="opt-2"></button>
            <button class="option-btn" onclick="submitChoice(3)" id="opt-3"></button>
        </div>

        <div id="area-fill" style="display: none;">
            <input type="text" id="fill-input" placeholder="請在此處輸入答案" autocomplete="off"><br>
            <button class="start-btn" style="font-size: 1.05rem; padding: 10px 40px; margin-top: 5px;" onclick="submitFill()">確認送出</button>
        </div>
    </div>

    <div id="screen-result" class="section">
        <h1>測驗結束</h1>
        <div class="title-line" style="width: 120px;"></div>
        <p id="result-score" style="font-size: 1.15rem; font-weight: bold; margin-bottom: 25px; letter-spacing: 1px;"></p>
        
        <hr>
        <h3 style="font-size: 1.1rem; color: #1a365d; letter-spacing: 1px; margin-bottom: 15px;">【 題目複查 】</h3>
        <div class="filter-btn-group">
            <button class="filter-btn active-filter" id="filter-all" onclick="filterReview('all')">顯示全部</button>
            <button class="filter-btn" id="filter-wrong" onclick="filterReview('wrong')">僅看錯題</button>
        </div>
        
        <div class="review-container" id="review-list"></div>

        <button onclick="restartGame()" style="margin-top: 15px; background-color: #b8a68d; border-color: #a49279; border-bottom-color: #8a7a63; color: #fff;">返回標題</button>
    </div>

</div>

<script>
    const rawQuestionBank = [
    { q: "1\n佛堂是道場最基本的單位，可分為哪兩種？", a: "家壇、公壇。", tags: ["佛規"] },
    { q: "2\n發一崇德臺灣有九大道場，除雲林、彰化、臺北、臺中、苗栗、高雄、臺南之外還有哪兩大道場？", a: "桃園、中興。", tags: ["組織"] },
    { q: "3\n目前發一崇德海外有幾大道場？幾個道務中心？", a: "七、十七。", tags: ["數字"] },
    { q: "4\n道場是我們求道、_________、_________、_________、_________及行道的地方。", a: "學道、修道、講道、辦道。", tags: ["道義"] },
    { q: "5\n在先天，我們的靈性都來自_________，是　明明上帝所分化的。", a: "無極理天。", tags: ["道義"] },
    { q: "6\n明明上帝全名為何？\n明明上帝_________清虛_________至聖_________十方_________真宰。", a: "無量、至尊、三界、萬靈。", tags: ["道義"] },
    { q: "7\n在現世修辦的因緣，我們都是一代明師_________、_________的弟子，是_________、_________的後學。", a: "濟公活佛（天然古佛）、月慧菩薩（中華聖母）、白水聖帝（老前人）、不休息菩薩（前人）。", tags: ["多人物"] },
    { q: "8\n道場的理想，師尊的三大宏願為何？\n（1）在先天，_________，達本還源。\n（2）在後天，復興_________。\n（3）移風易俗，化世界為大同。", a: "渡化眾生、中華道統文化。", tags: ["道義"] },
    { q: "9\n發一崇德成立有七個文教基金會，是哪七個文教基金會？", a: "崇德、崇仁、崇禮、崇義、光慧、崇智、崇元。", tags: ["組織"] },
    { q: "10\n一貫真傳的殊勝非語言文字可以道盡，其中又以哪三者最為殊勝？", a: "天命真傳、道統真傳、心法真傳。", tags: ["道義"] },
    { q: "11\n從我們求道，我們的祖先在地府領一朵白蓮花，聽地藏古佛講經說法，免受地府之苦，這就是所謂的「一子求道，_________」。", a: "九玄七祖皆沾光。", tags: ["道義"] },
    { q: "12\n路祖的名諱是？哪裡人？生於何時？", a: "上中下一、山東濟寧、清道光二十九年（一八四九）農曆四月二十四日。", tags: ["名地生"] },
    { q: "13\n路祖乃什麼佛化身？為後東方第幾代祖師？", a: "彌勒古佛、後東方第十七代祖。", tags: ["人物"] },
    { q: "14\n路祖於民國十四年（一九二五）歲次乙丑_________日歸天，享年幾歲？", a: "二月初二、享年七十六歲。", tags: ["日歲"] },
    { q: "15\n路祖歸天後　老母有命，由路祖的妹妹路老姑奶代理天命，其名諱？", a: "上中下節。", tags: ["名"] },
    { q: "16\n路祖在世辦道時，最初規定超拔一層父母須渡多少人？", a: "一百。", tags: ["數字"] },
    { q: "17\n路祖歸天後一年，借山西楊春齡竅，來山東濟寧道場顯化，在一百天內，口吐何妙典？又說何經傳世？", a: "金公妙典、彌勒救苦真經。", tags: ["經典名字"] },
    { q: "18\n路祖歸天後，　老母賜封聖號為何？", a: "金公祖師。", tags: ["人物"] },
    { q: "19\n弓長師尊是_________城南大流店村人。生於清光緒十五年（一八八九）農曆七月十九日。", a: "山東濟寧。", tags: ["地"] },
    { q: "20\n弓長師尊之名諱、字？歸天後，　老母賜封聖號為何？", a: "師尊名諱上奎下生、字上光下璧、天然古佛。", tags: ["名號"] },
    { q: "21\n自師尊開始，以後誠心修道者，渡多少人即可超拔一層父母？", a: "六十四。", tags: ["數字"] },
    { q: "22\n民國十九年各處仙佛臨壇訓云：天時緊急，　老母有命普渡三曹，_________，_________，人鬼仙一起普渡，都臨凡搭幫助道。", a: "上天不留一佛子、西天不留一菩薩。", tags: ["精神"] },
    { q: "23\n民國二十九年（一九四〇）之前，以何方式鍛鍊有緣佛子？", a: "立爐立會。", tags: ["班程"] },
    { q: "24\n民國二十九年（一九四〇）春季大典，師尊再三懇求　老母，請免爐會　老母有何指示？\n從此之後，_________，不再立爐會。", a: "以天地為鼎爐。", tags: ["班程"] },
    { q: "25\n師尊於民國三十六年（一九四七）農曆何時歸天？享年若干？", a: "八月十五日、享年五十九歲。", tags: ["日歲"] },
    { q: "26\n子系師母之名諱、道號為何？成道後，　老母封何聖號？", a: "師母名諱上素下真、道號上慧下明、中華聖母。", tags: ["名號"] },
    { q: "27\n子系師母是哪位仙佛倒裝降世？", a: "月慧菩薩。", tags: ["人物"] },
    { q: "28\n師母哪裡人？生於何時？", a: "山東單縣人、生於清光緒二十一年（一八九五）農曆八月廿八日。", tags: ["地生"] },
    { q: "29\n師母於何時，由老前人透過關係，自香港接到臺灣？", a: "民國四十三年（一九五四）。", tags: ["年份"] },
    { q: "30\n師母所渡之第一位氣天大仙是？後因助道有功，　老母加封為？", a: "雲遊姑娘、教化菩薩。", tags: ["人物"] },
    { q: "31\n民國五十二年（一九六三）斗六崇修堂遇官考，將遭勒令解散，師母乃於佛前燒大把香，請求　老母慈悲赦免，在佛堂幾叩首，一切安然度過？", a: "一萬。", tags: ["數字"] },
    { q: "32\n師母於民國六十四年（一九七五）農曆何時歸天？享年若干？", a: "二月廿三日、享年八十一歲。", tags: ["日歲"] },
    { q: "33\n孔子自述修道成德的歷程為何？\n「吾十有五而志於學，三十而立，四十而不惑，五十而_________，六十而_________，七十而從心所欲、不踰矩。」", a: "知天命、耳順。", tags: ["經典"] },
    { q: "34\n孔子以_________為成聖的依據，以_________為啟發仁心的起步，以_________作為應世的必要修養。", a: "仁心、孝悌、禮。", tags: ["經典"] },
    { q: "35\n顏子名回，字子淵，魯國人，後世稱為_________。", a: "復聖。", tags: ["人物"] },
    { q: "36\n《論語．述而篇》子謂顏淵曰：「_________，_________，唯幕與爾有是乎！」", a: "用之則行、舍之則藏。", tags: ["經典"] },
    { q: "37\n曾子的志節堅貞弘毅，曾子說：「士不可以不弘毅，任重而道遠。_________，不亦重乎？_________，不亦遠乎？」", a: "仁以為己任、死而後已。", tags: ["經典"] },
    { q: "38\n不休息菩薩結緣訓〈十萬八千里路程〉：「無論這條路上，有多麼坎坷，有多少考驗。難關中，我告訴自己_________。」", a: "永不放棄。", tags: ["精神"] },
    { q: "39\n曾子得孔門心法，傳承聖道乃依據：子曰：「參乎，_________。」曾子曰：「唯。」子出，門人問曰：「何謂也？」曾子曰：「夫子之道，_________，而已矣。」", a: "吾道一以貫之、忠恕。", tags: ["經典"] },
    { q: "40\n禮記孟子主張，四端之心，人皆有之；孟子曰：「_________，非由外爍我也，我固有之也，弗思耳矣。故曰：求則得之，舍則失之。」", a: "仁義禮智。", tags: ["經典"] },
    { q: "41\n孟子曰：「人之所不學而能者，其_________也；所不慮而知者，其_________也。」", a: "良能、良知。", tags: ["經典"] },
    { q: "42\n孟子說：「學問之道無他，求其_________而已矣。」", a: "放心。", tags: ["經典"] },
    { q: "43\n開孟子曰：「天將降大任於是人也，必先苦其心志，勞其筋骨，餓其體膚，空乏其身，行拂亂其所為；所以動心_________，增益_________。」", a: "忍性、其所不能。", tags: ["經典"] },
    { q: "44\n師尊云：「蓋聞先王之道，以_________為本；聖人之教，以_________為先。」", a: "正心修身、禮門義路。", tags: ["經典"] },
    { q: "45\n膜拜叩頭，是拜_________。所以當我們在對仙佛叩頭時，就在對我們自己作_________。」", a: "自己的性命、最好的反省。", tags: ["道義"] },
    { q: "46\n自古佛佛_________，師師_________。", a: "惟傳本體、密付本心。", tags: ["經典"] },
    { q: "47\n天命明師藉傳道師之手，開啟眾生_________，點亮心燈。", a: "無縫鎖。", tags: ["道義"] },
    { q: "48\n〈龍天表〉上奏之意義為何？", a: "天榜掛號、地府抽丁。", tags: ["道義"] },
    { q: "49\n湯之盤銘曰：「苟日新，日日新，_________。」", a: "又日新。", tags: ["經典"] },
    { q: "50\n濟公活佛慈訓〈學道的殊勝〉：「學道之過程，有順考、亦有逆考、顛倒考、智慧考；而其中以_________、以_________為師，定性見智，必然不受外在之干擾。」", a: "真知、覺。", tags: ["道義"] },
    { q: "51\n觀音菩薩慈訓：修道三不離。是不離甚麼？", a: "不離道場、不離經典聖訓、不離前賢。", tags: ["道義"] },
    { q: "52\n我們求道之後已經在理天開戶了，開了戶就要將無形的錢存進去，這無形的錢是指？", a: "行功立德。", tags: ["道義"] },
    { q: "53\n老前人說：「明師一指點，告訴我們這個通天的正門叫做_________。", a: "通天竅（玄關竅）。", tags: ["道義"] },
    { q: "54\n老前人說：「我們得這一指點叫_________，……按著天性去做，就叫_________。」", a: "明心、見性。", tags: ["道義"] },
    { q: "55\n達摩祖師為後東方第一代祖，傳的是上乘大法，直指人心、見性成佛、不立文字、一步直超。有四句偈來形容達摩祖師傳道的真義？\n「達摩西來_________，全憑_________用功夫；若要_________尋佛法，筆尖蘸乾洞庭湖。」", a: "一字無、心意、紙上。", tags: ["經典"] },
    { q: "56\n老前人說：「我們道中有內功，是真人靜坐。道法自然，坐的時候……」如何做？\n（身體要自然，背脊要直，兩眼自然八分閉，_________，舌頂上顎，_________，兩膀下垂放鬆，自然氣貫丹田。）", a: "平心靜氣、二目守玄。", tags: ["道義"] },
    { q: "57\n命有三命，其內容為何？", a: "天命、宿命、陰命。", tags: ["道義"] },
    { q: "58\n在《論語聖訓・序》中，至聖先師慈訓：「吾之一生，實為_________。」", a: "明傳詩書暗傳道。", tags: ["經典"] },
    { q: "59\n《論語・學而》，曾子每天拿哪三件事來來反省自己？\n（1）為人謀，而_________乎？\n（2）與朋友交，而_________乎？\n（3）傳，_________乎？", a: "不忠、不信、不習。", tags: ["經典"] },
    { q: "60\n《論語・學而》：「夫子至於是邦也，必聞其政，_________以得之。」", a: "溫良恭儉讓。", tags: ["經典"] },
    { q: "61\n《論語・公冶長》：「子貢曰：『夫子之文章，可_________；夫子之言_________，不可得而聞也。』」", a: "得而聞也、性與天道。", tags: ["經典"] },
    { q: "62\n《論語・季氏》：「子曰：『君子有三畏，_________，_________，_________』。」", a: "畏天命、畏大人、畏聖人之言。", tags: ["經典"] },
    { q: "63\n《論語・顏淵》：顏淵問仁，孔子答之如何為仁？\n（_________為仁，一日克己復禮，天下歸仁焉。為仁由己，而由人乎哉？）", a: "克己復禮。", tags: ["經典"] },
    { q: "64\n《論語・顏淵》顏淵問為仁之條目，請問孔子如何答之？\n「非禮勿_________，非禮勿_________，非禮勿_________，非禮勿_________。」", a: "視、聽、言、動。", tags: ["經典"] },
    { q: "65\n《論語・陽貨》：子張問仁於孔子。孔子曰：「能行五者於天下，為仁矣。」請問此五者為何？", a: "恭、寬、信、敏、惠。", tags: ["經典"] },
    { q: "66\n《論語・學而》：子曰君子如何則「可謂好學也已」？\n君子食無_________，居無_________，敏於事而_________，就 有道而正焉。", a: "求飽、求安、慎於言。", tags: ["經典"] },
    { q: "67\n《論語・衛靈公》：孔子在陳絕糧，從者病，莫能興。子路慍見曰：「君子亦有窮乎？」請問孔子如何言答？\n「君子固窮，小人_________。」", a: "窮斯濫矣。", tags: ["經典"] },
    { q: "68\n《論語・季氏》：孔子曰君子有三戒。\n（1）少之時，血氣未定，戒之在_________。\n（2）及其壯也，血氣方剛，戒之在_________。\n（3）及其老也，血氣既衰，戒之在_________。", a: "色、鬥、得。", tags: ["經典"] },
    { q: "69\n《論語・述而》：孔子以哪四教來教導學生？", a: "文、行、忠、信。", tags: ["經典"] },
    { q: "70\n《論語・子罕》：子絕四，是哪四件事？", a: "毋意、毋必、毋固、毋我。", tags: ["經典"] },
    { q: "71\n《論語・季氏》：孔子說益者三友，為何？損者三友，為何？\n（1）益者三友，友直，友諒，友_________。\n（2）損者三友：友便辟，友善柔，友_________。", a: "多聞、便佞。", tags: ["經典"] },
    { q: "72\n《論語・雍也》：「哀公問：『弟子孰為好學？』孔子對曰：『有顏回者好學，不遷怒，不_________，不幸短命死矣！今也則亡，未聞好學者也。』」", a: "不貳過。", tags: ["經典"] },
    { q: "73\n《論語・雍也》：「子曰：『回也，其心_________，其餘，則_________而已矣。』」", a: "三月不違仁、日月至焉。", tags: ["經典"] },
    { q: "74\n《論語・雍也》：「子曰：『賢哉，回也！一簞食，一瓢飲，在陋巷；_________，_________。賢哉！回也。』」", a: "人不堪其憂、回也不改其樂。", tags: ["經典"] },
    { q: "75\n《論語・泰伯》：曾子有疾，召門弟子曰：「啟予足！啟予手！詩云：『戰戰兢兢，_________，_________。』而今而後，吾知免夫！小子！」", a: "如臨深淵、如履薄冰。", tags: ["經典"] },
    { q: "76\n《論語・衛靈公》：「子貢問曰：『有一言而可以終身行之者乎？』子曰：『其恕乎！_________，_________。』」", a: "己所不欲、勿施於人。", tags: ["經典"] },
    { q: "77\n何謂三清？", a: "聖凡清、男女清、錢財清。", tags: ["道義"] },
    { q: "78\n三天主考院長師兄，如何闡釋三清四正？", a: "男女界限清、三清四正嚴、正容並正色、正心並正言。", tags: ["道義"] },
    { q: "79\n陰命是習性、_________、嗜好所造成之業力苦根。", a: "脾氣。", tags: ["道義"] },
    { q: "80\n何謂四正？", a: "身正、心正、言正、行正。", tags: ["道義"] },
    { q: "81\n何謂心正？不_________、不_________、不_________。", a: "貪心、瞋恚、愚癡。", tags: ["道義"] },
    { q: "82\n何謂言正？不妄言、不_________、不_________、不_________，乃修道者最基本的戒律之一。", a: "兩舌、綺語、惡口。", tags: ["道義"] },
    { q: "83\n三施並進為何？", a: "財施、法施、無畏施。", tags: ["道義"] },
    { q: "84\n何謂四攝法？", a: "布施、愛語、利行、同事。", tags: ["道義"] },
    { q: "85\n慈悲喜捨，仙佛如何釋義？\n只有_________沒有條件之謂慈.只有犧牲沒有自己之謂悲.只有義務沒有權利之謂喜。只有_________沒有佔有之謂捨。", a: "奉獻、付出。", tags: ["精神"] },
    { q: "86\n〈百孝經〉：「天地重孝孝當先，一個孝字_________。」", a: "全家安。", tags: ["經典"] },
    { q: "87\n〈百孝經聖訓輯要〉：「綱常倫理，首重乎孝；千經萬典，猶以_________為先。」", a: "孝悌。", tags: ["經典"] },
    { q: "88\n濟公活佛慈訓〈渡人之殊勝〉：「古云：『救人一命，_________。』」", a: "勝造七級浮屠。", tags: ["經典"] },
    { q: "89\n師尊說：「天上無_________，人間無不_________。要成就自己的最好方法就是_________。」", a: "無功功功德神、忠孝聖、渡人求道。", tags: ["精神"] },
    { q: "90\n渡人成功即是_________。渡人不成功，也是_________。", a: "渡化有功、勸化有功。", tags: ["精神"] },
    { q: "91\n師尊師母於_________，同領天命，普渡_________，開六萬年來秘法不傳六耳之先河，道不分乾坤，人人可以求道、修道、辦道。", a: "民國十九年（一九三〇年）、三曹。", tags: ["年份"] },
    { q: "92\n師母於一九七五爾功圓果滿駕返天庭。何人續傳天命，足跡遍佈五大洲？", a: "白水老人韓道長。", tags: ["人物"] },
    { q: "93\n一九九五年韓老前人返天交旨，_________再續天命傳承，提拔優秀人才使道場更上一層樓。", a: "大姑陳前人。", tags: ["人物"] },
    { q: "94\n在一九八四年第一班點傳師懺悔班中，中華聖母借竅臨壇慈訓「一盞燈籠照九州，但願眾生早回頭，_________，裕修玉台輔左右，明德亦須多珍重，五福祥臻照根由，一根扁擔乾坤挑，復命承肩渡緣儔。」以明示天命傳承。", a: "雨霖根源瑩如辦。", tags: ["精神"] },
    { q: "95\n民國三十八年（一九四九）老前人在斗六火車站前買下何處？安設佛堂，前人奉老前人之命從臺北調到斗六開荒。", a: "青年照相館。", tags: ["地點"] },
    { q: "96\n民國四十年（一九五一）在斗六青年照相館的佛堂，因避官考搬遷至何處繼續辦道？", a: "太和旅社。", tags: ["地點"] },
    { q: "97\n民國四十二年（一九五三）道務由太和旅社轉到何處？從此奠定了後來公共佛堂道務發展的基礎。", a: "崇修堂。", tags: ["地點"] },
    { q: "98\n前人老在民國五十七年（一九六八）開創學界，有何校學生求道？", a: "逢甲大學。", tags: ["地點"] },
    { q: "99\n民國六十六年（一九七七），前人在福山開學界第一屆什麼班？", a: "接棒班。", tags: ["班程"] },
    { q: "100\n民國六十五年（一九七六），前人首次開荒國外哪個國家？", a: "日本。", tags: ["地點"] },
    { q: "101\n民國七十年（一九八一）四月，前人抱著_________，_________的大無畏的精神，回到台北重整道場？", a: "在哪裡跌倒、就在哪裡站起來。", tags: ["精神"] },
    { q: "102\n民國七十三年（一九八四），臺北道場大家同心協力，重建道場，在臺北市錦州街成立_________，成為穩定臺北道務的重心，也是臺北道場邁向現代化的里程碑。", a: "天恩總壇。", tags: ["地點"] },
    { q: "103\n民國七十四年（一九八五）召開全省進修班課程研討會，進修班改制，課程內容新規劃，全省統一教材，故在一九八六爾正式建立崇德完整的_________，教育制度。", a: "五年進修班。", tags: ["班程"] },
    { q: "104\n民國七十五年（一九八六），全省各道場同步推動何種行政聯絡體系？", a: "忠義字班。", tags: ["班程"] },
    { q: "105\n民國七十九年（一九九〇）全省壇主班，前人提倡建立平安道場，邁向_________，使道場現代化有具體的目標。", a: "模範道場。", tags: ["精神"] },
    { q: "106\n民國八十一年（一九九二），為促進行政革新，前人提倡_________，為道務行政領導原則。民國八十二年（一九九三），國內外各道場齊推動。", a: "集體領導、整體帶動。", tags: ["精神"] },
    { q: "107\n民國八十三年（一九九四），為了使道場可大可久，前人在道場各壇主班慈示_________，做為修道人基本的涵養與修持方針。", a: "標準守則。", tags: ["精神"] },
    { q: "108\n民國八十六年（一九九七）十二月三十一日，光慧文教館「_________」崇德佛院舉行安座，崇德道場從此邁向新紀元。", a: "發一崇德道務中心。", tags: ["組織"] },
    { q: "109\n民國八十七年（一九九八），前人老提倡「二〇〇二年」之宏願，鼓勵各區逐年逐項由標準忠義字班，至標準佛堂、標準壇主，進而達到標準區，海內外各道場邁向「標準道場」，頒布公共佛堂以什麼為辦道目標？", a: "五常「仁義禮智信」。", tags: ["精神"] },
    { q: "110\n在人道上，止於至善應如何做？\n為人君，止於仁；為人臣，止於敬；為人子，止於_________；為人父，止於_________；與國人交，止於_________。", a: "孝、慈、信。", tags: ["經典"] },
    { q: "111\n民國八十四年（一九九五）農庫五月十四日，活佛師尊在日本_________複習班中臨壇，領著前人到　老母連前街天命，上天有命，前人代理天命。", a: "天一宮。", tags: ["地點"] },
    { q: "112\n民國九十七年（二〇〇八）一月六日晚上十一點三十分，前人功圓果滿、佛歸本位，　老母敕封為_________，在理天繼續領導發一崇德。", a: "不休息菩薩。", tags: ["人物"] },
    { q: "113\n民國一〇〇年（二〇一一）四月十六日、五月六日、七月十四日，不休息菩薩慈示點傳師進行亙古奇緣的_________，開啟了百代薪傳的契機。", a: "三爐三會。", tags: ["班程"] },
    { q: "114\n民國一〇四年（二〇一五），道場啟動什麼政策？崇德道務大躍進。", a: "固本圖強。", tags: ["精神"] },
    { q: "115\n民國一〇七年（二〇一八），不休息菩薩開道場，「九鼎天下」，臺灣原有雲林、彰化、臺北、臺中、苗栗、高雄、臺南，又開創_________、_________，成為九大道場。", a: "桃園、中興。", tags: ["組織"] },
    { q: "116\n民國八十二年（一九九三），前人為了道場財務能自給足，又能宏揚祖師宏慈精神，廣佈師尊師母聖德，照顧為道犧牲奉獻的學生，開展社會福利事業，乃興辦_________事業部。六年後，又創辦_________文化事業，發行正知正見的出版品。", a: "崇德發、光慧。", tags: ["組織"] },
    { q: "117\n二〇〇年精神指標，成功二〇〇年精神進更上一層樓，慈悲喜捨、萬眾一心、精誠團結、邁向標準。我們要發揮五大原動力。請問五大原動力為何？\n「向心力、結合力、推動力、_________力、_________力。」", a: "凝聚、團結。", tags: ["精神"] },
    { q: "118\n民國九十年（二〇〇一）起，確立年度精神指標為：成功□□□□年，精進更上一層樓，慈悲喜捨、萬眾一心、精誠團結、邁向標準。接下來如何學修講辦行？\n學道越學越_________、修道越修越_________、講道越講_________、辦道越辦越_________、行道越行越_________。", a: "和氣、歡喜、入性理、契機、中矩。", tags: ["精神"] },
    { q: "119\n民國八十八年（一九九九）十一月十四日，位作金陵山的發一崇德_________之神位，舉行安奉典禮。", a: "成道仙靈。", tags: ["人物"] },
    { q: "120\n民國八十九年（二〇〇條）九月，前人將崇德祠堂成道仙靈分為哪五部？\n助道部、_________部、文書部、_________部、醫藥部。", a: "護道、講經。", tags: ["組織"] },
    { q: "121\n有孝悌慈愛才能治國安邦，這父慈子孝、兄弟和睦，不就是天下的根本嗎？我們得從根本做起，先要正心修身，得要由你_________入手。", a: "家庭。", tags: ["道義"] },
    { q: "122\n師尊說過：「_________，如同竹籃打水一場空。」", a: "前功後過。", tags: ["道義"] },
    { q: "123\n開老前人說：「修心是修你自個兒的心，就是將後天的_________，我全都徹底的去改。」", a: "毛病脾氣嗜好。", tags: ["道義"] },
    { q: "124\n民國八十三年（一九九四）五月三日吉隆坡法會，老師慈悲說：「你們前人已經是一個_________的前人，不是一個普通的前人，你們要知道啊！全體點傳師要護持你們前人的領導，確實做到『_________、_________』知道嗎？……」", a: "身擔天命、集體領導、整體帶動。", tags: ["精神"] },
    { q: "125\n在宋朝時的濟公活佛，俗家姓李，名叫什麼？", a: "修緣。", tags: ["人物"] },
    { q: "126\n月慧菩薩倒裝降世彰顯之意義有三：\n一者、坤道應運，乾坤齊渡。\n二者、白陽修士不圖名相，為善不欲人知。\n三者為何？", a: "隱德如地、厚德載物。", tags: ["精神"] },
    { q: "127\n師母幼承庭訓，聰慧穎悟，仁善好佛，於民國幾年，求得大道？", a: "民國七年（一九一八年）。", tags: ["年份"] },
    { q: "128\n師尊成道後，師母為消弭災難，重整道場，於民國三十六年（一九四七）12月起由成都、重慶開始在全國舉行什麼班？辦理什麼事？", a: "開懺悔班、辦理接金線。", tags: ["班程"] },
    { q: "129\n民國六十四年（一九七五）農曆2月二十三日，突然天地變色，雷電交加，一位應世的活菩薩終於闔上祂老含淚的雙眼與世長辭，祂老功果園滿，回天交旨，上天敕封為_________。", a: "中華聖母。", tags: ["人物"] },
    { q: "130\n師母於民國四十三年（一九五四）寫信交代我們老前人設法接來台灣，師母來台後見弟子辦道情況，艱難困苦，魔考不斷，心如痛絞，於是悲切發願代弟子受苦，因此自囚色身多少年？", a: "二十餘。", tags: ["數字"] },
    { q: "131\n大道之沿革，三代以上，道在_________，一人而化天下，為青陽劫。三代以後，道在_________，三教繼續而出，各傳一方，為紅陽劫。現值三期末劫，道在_________，人人成道，個個成佛，為白陽劫。", a: "君相、師儒、黎庶。", tags: ["道義"] },
    { q: "132\n得道有哪四難？", a: "人身難得、三期難遇、中華難生、真道難逢。", tags: ["道義"] },
    { q: "133\n何謂三曹普渡？上可以渡_________，氣天諸仙；中可以渡_________；下可以渡_________。", a: "天上河漢星斗、人間芸芸眾生、地府幽冥鬼魂。", tags: ["道義"] },
    { q: "134\n亡靈超拔後歸於_________，復經百日修煉，以恢復純陽之體，後由　明明上帝派三官大帝，按功定果。", a: "理天天佛院自修堂。", tags: ["地點"] },
    { q: "135\n老母命三佛末後普渡收圓，此三佛所指為何？", a: "彌勒佛、濟公活佛、月慧菩薩。", tags: ["多人物"] },
    { q: "136\n《皇母訓子十誡．一誡》：原佛子自從三山坡離開　老母，至今時，屈指算已有多少年？", a: "六萬。", tags: ["數字"] },
    { q: "137\n《皇中訓子十誡》中所言「四貴」、「五盤」為何？\n四貴：仙、佛、_________、_________。\n五盤：天盤、地盤、人盤、_________、_________。", a: "神、聖、山妖、水怪。", tags: ["道義"] },
    { q: "138\n道場中稱三天主考院長，所指何人？", a: "茂田師兄。", tags: ["人物"] },
    { q: "139\n《皇中訓子十誡．二誡》：「今時下真機展普遍大地，諸天神眾仙佛共下東林，各處裡施顯化驚惺迷子，或_________或_________親渡原真。」", a: "飛鸞、借竅。", tags: ["道義"] },
    { q: "140\n《皇中訓子十誡．二誡》：「修天道離不了開闡渡化，發婆心用苦口不倦誨人，必須要_________，貴乎汝實行辦正己成人。」", a: "立定了沖天大愿。", tags: ["精神"] },
    { q: "141\n《皇中訓子十誡．五誡》：「不忍得這玉石俱焚不判，垂金線現靈光海內行舟。千條路萬條路無有生路，逢生路_________天道速求。」", a: "惟一貫。", tags: ["精神"] },
    { q: "142\n老前人常以五恩鼓勵大眾，尤其對孝敬父母、忠於國家、熱愛社會、博施濟眾等事業，不遺餘力。何謂五恩？", a: "天地君親師。", tags: ["道義"] },
    { q: "143\n老前人哪裡人？生於何時？", a: "河北省寧河縣人、生於清光緒二十七年（一九〇一）農曆三月二十二日。", tags: ["地生"] },
    { q: "144\n老前人名諱_________字傑卿，號_________，又字潔清，晚年自號_________，成道後，上天敕封為_________。", a: "恩榮、雨霖、白水老人、白水聖帝。", tags: ["名號"] },
    { q: "145\n老前人於何時求道？何時蒙師尊提拔領命？", a: "民國二十七年（一九三八）農曆7月二十七日求道、民國三十年（一九四一）農曆三月初三日領命為點傳師。", tags: ["年份"] },
    { q: "146\n老前人所渡之第一位氣天大仙是誰？由誰點道？", a: "司馬光大仙、師母。", tags: ["多人物"] },
    { q: "147\n老前人在大陸時，辦道總壇為何？", a: "天津同興壇。", tags: ["地點"] },
    { q: "148\n老前人於民國幾年奉何人之命渡海來臺開荒闡道？", a: "民國三十七年（一九四八）、師母。", tags: ["年份"] },
    { q: "149\n民國三十八年（一九四九），老前人因操勞過度，得了肋膜炎，情況危急，發心助印哪部經千本，並每天誦念，病情始見好轉？", a: "桃園明聖經。", tags: ["經典名字"] },
    { q: "150\n民國七十七年初（一九八八），老前人以道務前途為重，派祁玉鏞、陳鴻珍兩位前人為代表，參與一貫道總會籌備工作，終使政府政策開放，准許一貫道合法傳道，三月五日成立_________總會。", a: "中華民國一貫道總會。", tags: ["組織"] },
    { q: "151\n老前人何時歸天？享耆壽若干？", a: "民國八十四年（一九九五）農曆正月廿六日子時歸天、享耆壽九十五歲。", tags: ["日歲"] },
    { q: "152\n呂祖慈悲說：「千生萬劫得此身，需知前世種來因，此身_________，更待_________？」", a: "不向今生度、何時度此身。", tags: ["精神"] },
    { q: "153\n引保師引渡人求道，要以_________開導，不要用利誘或勉強的方式渡人求道。", a: "真理大道。", tags: ["道義"] },
    { q: "154\n父母的職責乃照顧孩子的_________。", a: "身心靈。", tags: ["道義"] },
    { q: "155\n佛堂供茶應倒約幾分滿？供果洗淨拭乾。", a: "七。", tags: ["數字"] },
    { q: "156\n家庭佛堂獻香共幾炷？\n明明上帝_________炷、諸天神聖_________炷、灶君_________炷。", a: "九、五、三、一。", tags: ["數字"] },
    { q: "157\n公共佛堂獻香幾炷？（十五炷。）其順序為何？\n_________五炷、_________三炷、_________三炷、南海古佛三炷、灶君一炷。", a: "明明上帝、諸天神聖、彌勒祖師。", tags: ["佛規"] },
    { q: "158\n每日獻香時間為何？", a: "早上五點到七點、晚上五點到七點。", tags: ["佛規"] },
    { q: "159\n前人老乘願再來誕生在河北省_________市，_________歲求得寶貴大道。", a: "天津、十八歲（民國二十九年、一九四〇）。", tags: ["地生"] },
    { q: "160\n前人老求道之後發心渡人，後來經哪位菩薩慈悲點化而立下清口茹素愿？", a: "觀音菩薩。", tags: ["人物"] },
    { q: "161\n前人首次謁見師尊，蒙師尊慈勉：「妳願學_________，一定能成功，我等妳，錯不了，錯不了。」是日後前人修辦最大的原動力。", a: "觀音菩薩。", tags: ["人物"] },
    { q: "162\n前人於國內外推動_________，使人人有事做，事事有人做。", a: "十組運作。", tags: ["班程"] },
    { q: "163\n大學之道在明_________，在_________，在止於至善。", a: "明德、親民。", tags: ["經典"] },
    { q: "164\n述止於至善之精義為何？", a: "知止而后有定、定而后能靜、靜而后能安、安而后能慮、慮而后能得。", tags: ["經典"] },
    { q: "165\n《大學》云：「物有本末，事有終始，_________，則近道矣。」", a: "知所先後。", tags: ["經典"] },
    { q: "166\n《大學》云：「如切如磋者，_________，如琢如磨者，_________。」", a: "道學也、自修也。", tags: ["經典"] },
    { q: "167\n《大學》云：「富潤屋，德潤身，心廣體胖，故君子_________。」", a: "必誠其意。", tags: ["經典"] },
    { q: "168\n《康誥》曰：「_________。」心誠求之，雖不中，亦不遠矣。", a: "如保赤子。", tags: ["經典"] },
    { q: "169\n《康誥》曰：「_________。」，道善則得之，不善則失之矣。", a: "惟命不于常。", tags: ["經典"] },
    { q: "170\n自天子以至於庶人，壹是皆以_________為本。", a: "修身。", tags: ["道義"] },
    { q: "171\n湯之盤銘曰：「苟日新，_________，又日新。」", a: "日日新。", tags: ["經典"] },
    { q: "172\n所謂誠其意者，毋自欺也，如_________，如_________，此之謂自謙，故君子必慎其獨也！", a: "惡惡臭、好好色。", tags: ["經典"] },
    { q: "173\n一家仁，一國興仁；一家讓，一國興讓；一人貪戾，一國作亂。其機如此。此謂一言_________，一人_________。", a: "僨事、定國。", tags: ["經典"] },
    { q: "174\n好人之所惡，惡人之所好，是謂拂人之性，菑必逮夫身。是故君子有大道，必_________以得之，_________以失之。", a: "忠信、驕泰。", tags: ["經典"] },
    { q: "175\n不休息菩薩慈訓〈標準崇德人〉：「崇德人肩負著傳承_________，延續_________之神聖使命。」", a: "天命金線、一貫道脈。", tags: ["精神"] },
    { q: "176\n不休息菩薩慈訓〈標準崇德人〉，崇德人「承擔著_________、_________之榮耀天職。」", a: "承先啟後、繼往開來。", tags: ["精神"] },
    { q: "177\n〈百孝經聖訓輯要〉：「孝者，人倫之始，大道之基，_________也。」", a: "事親之本。", tags: ["經典"] },
    { q: "178\n〈百孝經〉：「孝子謝世_________。」", a: "即為仙。", tags: ["經典"] },
    { q: "179\n〈百孝經聖訓輯要〉：「愛親者，不敢_________；敬親者，不敢_________。」", a: "惡於人、慢於人。", tags: ["經典"] },
    { q: "180\n〈百孝經聖訓輯要〉：「事雙親，氣要_________，色要_________，語要_________，心要_________。」", a: "平和、溫雅、真誠、寬慈怡。", tags: ["經典"] },
    { q: "181\n正確的飲食習慣；早午晚應如何吃？\n早上吃得_________。中午吃得_________。晚上吃得_________。_________最好不要吃。", a: "好、飽、少、宵夜。", tags: ["道義"] },
    { q: "182\n人生五福是哪五福？", a: "富貴、長壽、康寧、好德、善終。", tags: ["道義"] },
    { q: "183\n南屏道濟慈訓〈至善班〉：「至善者，以_________。」", a: "一顆本心行道。", tags: ["道義"] },
    { q: "184\n禮記濟公活佛慈訓〈崇德道場〉：「崇德二字，非只是宗教名詞，更象徵_________之精神，深具歷史重要的地位。」", a: "一貫薪傳。", tags: ["精神"] },
    { q: "185\n濟公活佛慈訓〈法會護持之殊勝〉：「白陽應運，大開普渡，天命明師倒裝降世；為挽佛子_________，故開佛門，大演妙法。」", a: "同歸無極。", tags: ["道義"] },
    { q: "186\n修辦道程圖以甚麼為起點，以甚麼為終點？", a: "以求道為起點、以成聖成賢為終點。", tags: ["道義"] },
    { q: "187\n修辦道程進入十組，以哪兩組為先？", a: "總務為先、文書培養。", tags: ["佛規"] },
    { q: "188\n崇德道場的三線共構是哪三線？", a: "天職、班程、十組。", tags: ["佛規"] },
    { q: "189\n為什麼要吃素呢？\n吃素可以培養_________，可以了斷_________，不再造罪了。", a: "慈悲心、惡緣。", tags: ["道義"] },
    { q: "190\n辦道是為了什麼？", a: "了願。", tags: ["道義"] },
    { q: "191\n修身的要點為何？\n言_________、行_________、懲忿窒慾、遷善_________。", a: "忠信、篤敬、改過。", tags: ["道義"] },
    { q: "192\n我們修道要以_________為榜樣，勿與一般人比較、計較，此即：鳥隨鳳凰_________，人伴聖賢_________。", a: "聖賢、飛得遠、品德高。", tags: ["道義"] },
    { q: "193\n要想心平氣和，必須修心煉性，多接受別人的磨煉，效法彌勒佛的精神：「大肚能容，了卻人間_________；滿腔歡喜，笑開天下_________。」", a: "多少事、古今愁。", tags: ["道義"] },
    { q: "194\n修己以_________為要，涉世以_________為先。", a: "清心、慎言。", tags: ["道義"] },
    { q: "195\n認自己之不是，即清心丹；想他人之好處，即_________。", a: "順氣丹。", tags: ["道義"] },
    { q: "196\n孔子信己可以成聖，故學而_________。見世人皆可以成聖，故誨人_________。", a: "不厭、不倦。", tags: ["經典"] },
    { q: "197\n閒談莫論_________，誠哉是言，爾等守真道，_________一團。", a: "人非、和氣。", tags: ["道義"] },
    { q: "198\n不休息菩薩慈訓〈忠義傳承〉：「傳國之寶在於忠，傳家之寶在於_________，傳德之寶在於_________，傳世之寶在於義。」", a: "孝、仁。", tags: ["道義"] },
    { q: "199\n不休息菩薩慈訓〈三界一元化〉：「三界以和諧、_________、_________，合心，分工進前」", a: "和平、合作。", tags: ["道義"] },
    { q: "200\n不休息菩薩慈訓〈三界一元化〉：「故整體崇德人，各司_________，各盡其心，各了_________；助大道使命無限，永續傳承也。」", a: "其職、其愿。", tags: ["道義"] },
    { q: "201\n天然古佛於〈天職的殊勝〉訓文中慈示，天職於此白陽道場之真義為何？\n「人間有形，天上有名；天職，便於修士者修辦_________之門，始有天職之稱。」", a: "行功。", tags: ["道義"] },
    { q: "202\n真正修道人，應該積極，走入人群，深入社會，幫助師尊師母，救世救人，大開普渡；如同師尊所說：「有事_________易，無事_________難。」", a: "建功、建功。", tags: ["道義"] },
    { q: "203\n宋儒張載講哪一段話，道出一個知識分子，應有的理想與抱負？\n為天地_________，為生民_________，為往聖繼_________，為萬世開_________。", a: "立心、立命、絕學、太平。", tags: ["經典"] },
    { q: "204\n我們修道人應該發菩提心，上_________，下_________。", a: "上求佛道、下化眾生。", tags: ["道義"] },
    { q: "205\n新道親應發菩提心去渡化人。老道親、講師、壇主則應發比菩提心還要大的心，也就是佛所發的「四無量心」。所謂四無量心為何？", a: "慈、悲、喜、捨。", tags: ["道義"] },
    { q: "206\n修道入門，_________為首，修行急務，_________當先，心發則_________，愿立則_________。", a: "發心、立愿、眾生可渡、佛道堪成。", tags: ["道義"] },
    { q: "207\n恩師慈示：「修道人要熟悉所有的佛規禮節，也是修道的必備功課。藉著佛規禮節來_________，使我們的行為不會產生偏差。」", a: "約束身心。", tags: ["道義"] },
    { q: "208\n漢鍾離大仙慈悲說：「不要小看這十五條佛規，它是非常好的_________，照著去行_________。」", a: "天梯、成佛有餘。", tags: ["道義"] },
    { q: "209\n在佛堂裡，人家行功的東西、錢財，你們一定要一一交代清楚，不可馬虎，如此才是_________，而成佛也才有希望。", a: "手續必清。", tags: ["道義"] },
    { q: "210\n法無定法，眾生有八萬四千種心，你們也要有八萬四千種法，要學會如何隨時隨地「_________，_________」。把握自性真我，應對一切因緣，並且在這當中學會「應無所住而生其心」，這才算真正的活潑應事。", a: "事來則應、事去則靜。", tags: ["道義"] },
    { q: "211\n佛堂有如一艘法船，壇主為法船的_________，責任務其大，即使是小小的家庭佛堂，當個小壇主，也可辦理_________的事務，也能帶人_________，是多麼榮耀、多麼殊勝啊！", a: "舵手、超生了死、回天堂。", tags: ["道義"] },
    { q: "212\n恩師慈悲：「為壇主者，居眾人之首，而為_________，是三千六百聖，四萬八千賢的_________。」", a: "一壇之領袖、候選人。", tags: ["道義"] },
    { q: "213\n當壇主、副壇主，道親來時的送往迎來，禮貌的接待，就如同_________。", a: "禮敬諸佛。", tags: ["道義"] },
    { q: "214\n仙佛說：「今日能當一位壇主，至少前生修_________世以上，都是來歷不凡。」", a: "七。", tags: ["數字"] },
    { q: "215\n當壇主、副壇主，多建立一個家，創造彌勒家園，間接幫助_________及廣設佛堂，_________。", a: "三多、萬家生佛。", tags: ["道義"] },
    { q: "216\n擔任壇主、副壇主，行功立德是天爵，諸佛菩薩佛力加持，亦是行孝良方，更可讓_________沾光。", a: "九玄七祖。", tags: ["道義"] },
    { q: "217\n關聖帝君，姓關名羽，字雲長，河東解梁人，生於東漢桓帝延熹三年（西元一六〇年）_________。卒於漢獻帝建安二十四年（西元二一九年）12月，享壽_________。", a: "六月二十四日、六十。", tags: ["日歲"] },
    { q: "218\n張飛三國蜀漢涿郡人，字益德，亦作翼德。與劉備、關羽桃園三結義，情同手足。成神後，明萬曆年間，敕封關羽為三界_________，故稱張桓侯為伏魔副將，鸞門尊為張_________。", a: "伏魔大帝、桓侯大帝。", tags: ["多人物"] },
    { q: "219\n呂祖身上恆佩著一隻寶劍，是有何意義？\n是斬斷_________、_________，煩惱的法器。", a: "貪嗔、愛慾。", tags: ["道義"] },
    { q: "220\n岳飛一生忠直，心地光明，廉潔清高，作一首_________，忠貞正氣，萬古流芳。", a: "滿江紅。", tags: ["經典名字"] },
    { q: "221\n三表是指哪三表？\n_________表文。_________表文。_________表文。", a: "求道、超拔、結緣。", tags: ["佛規"] },
    { q: "222\n張大仙慈訓〈講培班〉：「故凡為講培者，皆是_________，皆有擔起三曹_________之大事，皆可證行白陽修士之聖跡。」", a: "道中骨幹、普渡收圓。", tags: ["道義"] },
    { q: "223\n若新道親不明佛規，把自己當父母親或長輩之引保師，應如何處理？", a: "應寫更正引、保師姓名表文更正。", tags: ["佛規"] },
    { q: "224\n超拔類別為何？\n超拔_________曰超拔。超拔_________曰恩拔。超拔_________曰義拔。", a: "長輩、晚輩、平輩。", tags: ["佛規"] },
    { q: "225\n超拔條件，有何規定？\n渡_________人以上。_________。本身_________。功德費為一般之十至一百倍以上。崇德負責群許可。", a: "二十、齊家求道、清口茹素。", tags: ["佛規"] },
    { q: "226\n《中庸》首章開頭前三句為何？\n天命之謂_________，率性之謂_________，修道之謂_________。", a: "性、道、教。", tags: ["經典"] },
    { q: "227\n《中庸》：「子曰：『回之為人也，擇乎中庸，得一善，則_________而弗失之矣。』」", a: "拳拳服膺。", tags: ["經典"] },
    { q: "228\n孔子如何說君子之強？\n「君子_________，強哉矯！_________，強哉矯！國有道，不變塞焉，強哉矯！國無道，至死不變，強哉矯！」", a: "和而不流、中立而不倚。", tags: ["經典"] },
    { q: "229\n《中庸》：「君子之道，造端乎夫婦，及其至也，_________。」", a: "察乎天地。", tags: ["經典"] },
    { q: "230\n《中庸》：「上不怨天，下不尤人，故君子_________，小人行險以徼幸。」", a: "居易以俟命。", tags: ["經典"] },
    { q: "231\n孔子說：大德者必如何？\n必得其位，必得其_________，必得其_________，必得其_________。", a: "祿、名、壽。", tags: ["經典"] },
    { q: "232\n孔子對知與行如何論述？\n「或生而知之，或學而知之，或困而知之，及其知之，一也。或_________而行之，或_________而行之，或是_________而行之，及其成功，一也。」", a: "安、利、勉強。", tags: ["經典"] },
    { q: "233\n《中庸》：「一人能之己百之，一人十能之己千之。果能此道矣，雖愚必明，_________。」", a: "雖柔必強。", tags: ["經典"] },
    { q: "234\n《中庸》云：「唯_________，為能經綸天下之大經，立天下之大本，知天地之化育。」", a: "天下至誠。", tags: ["經典"] },
    { q: "235\n功德費應由_________負責說明，不宜由掛號者負責。", a: "引保師。", tags: ["人物"] },
    { q: "236\n乾坤童女，如何區分？", a: "十六歲以上男為乾，女為坤。十五歲以下男為童，女為女。", tags: ["佛規"] },
    { q: "237\n夫！人神好清，而心擾之；人心好靜，而慾牽之。常能_________，而心自靜；_________，而神自清。自然_________，三毒消滅。", a: "遣其慾、澄其心、六慾不生。", tags: ["經典"] },
    { q: "238\n眾生所以不得真道者，_________。", a: "為有妄心。", tags: ["道義"] },
    { q: "239\n真常之道，_________，得悟道者，_________！", a: "悟者自得、常清靜矣。", tags: ["道義"] },
    { q: "240\n崇德學院徽章中的妙訓為何？", a: "傳承。", tags: ["經典名字"] },
    { q: "241\n彌勒祖師慈心悲願，故凡道親婚喪喜慶應以_________為主，以顯天地有和氣、人間有喜氣，是為彌勒淨土。", a: "素齋蔬食。", tags: ["佛規"] },
    { q: "242\n濟公活佛慈訓〈新時代大格局〉：「在學道中堅認道統，在修道中_________，在講道中堅守道義，在辦道中堅恆道念，在行道中堅貞道脈。」", a: "堅定道心。", tags: ["精神"] },
    { q: "243\n如何積極投入參與修辦？\n一、追隨師尊、師母的天命，護持老前人、前人慧命。\n二、開荒闡道，廣渡有緣。\n三、以天心為己心，_________。\n四、做師尊、師母千百億化身。", a: "以師志為己志。", tags: ["精神"] },
    { q: "244\n何謂三厭？", a: "天厭飛禽、地厭走獸、水厭魚蝦水族。", tags: ["道義"] },
    { q: "245\n《涅槃經》云：「迦葉白佛言：『云何如來不敢食肉？』佛言：『善男子，_________。』」", a: "夫食肉者斷大悲種。", tags: ["經典"] },
    { q: "246\n天地之大德曰_________，世人之大惡曰_________。", a: "生、殺生。", tags: ["道義"] },
    { q: "247\n南海古佛云：「奉勸世人早吃齋，_________。」", a: "人性物性一處來。", tags: ["經典"] },
    { q: "248\n防持齋茹素可以消弭刀兵劫難，以古德詩來闡述之？\n「千百年來_________，冤深似海恨難平；欲知世上_________，但聞_________夜半聲。」", a: "碗裡羹、刀兵劫、屠門。", tags: ["經典"] },
    { q: "249\n白陽修士必修的四門功課為何？", a: "品格、功德、火候、禮節。", tags: ["道義"] },
    { q: "250\n什麼叫治心五帖藥方？\n認清自己之_________即清心丹。常懷_________之心即順氣丹。不受凡慾之遷即四神丸。拔苦予樂之懷即佛手散。證悟世間之苦即逍遙散。", a: "非、善解。", tags: ["道義"] },
    { q: "251\n觀世音菩薩往昔早已成佛，號_________如來。", a: "正法明如來。", tags: ["人物"] },
    { q: "252\n觀世音菩薩早就成佛了，為助三曹普渡，處處顯化，搭幫助道，由於其道場在南海普陀山故又稱_________。", a: "南海古佛。", tags: ["人物"] },
    { q: "253\n觀世音菩薩的修持法門為何？", a: "耳根圓通之法。", tags: ["道義"] },
    { q: "254\n南屏道濟慈訓〈獻香叩頭之局勢〉：「外藏於誠，外_________。」", a: "盡其禮。", tags: ["道義"] },
    { q: "255\n師尊說：「人爵那有_________，功名焉有_________。」", a: "天爵貴、道名高。", tags: ["道義"] },
    { q: "256\n師尊說：「悞凡事，終屬浮泛；捨道德，_________。」", a: "空落一生。", tags: ["道義"] },
    { q: "257\n師尊說：「大道修來有易難，也知由我亦由天；若非_________，動有群魔作障緣。」", a: "積功修陰德。", tags: ["道義"] },
    { q: "258\n師尊說：「欲想了你前生債，憑你_________能勾消。」", a: "功德。", tags: ["道義"] },
    { q: "259\n師尊說：「現值三期大開普渡之時，得道容易修道難，修道容易了道難，只許有功，不許有過，如若前功後過，如同_________，不可不慎。」", a: "千日打柴一日燒。", tags: ["道義"] },
    { q: "260\n在道場中，修道必須遵守師命，對於師命應如何遵守？\n師尊說：「未命不敢先，既命不敢後，_________不可違，_________不可自專。但是須看甚麼事，如若濟世救民、仁義道德之事，又當別論。」", a: "有命、無命。", tags: ["道義"] },
    { q: "261\n〈修道須知〉「萬劫千生得此身，幾回出沒幾回循；此身_________，更待_________。」", a: "不向今生度、何時度此身。", tags: ["經典"] },
    { q: "262\n白陽修行有何勝？\n修大道，半凡情，不打坐，不誦經，只用苦口_________，多多益善_________。", a: "多勸化、救善靈。", tags: ["道義"] },
    { q: "263\n南海古佛慈訓〈元亨利貞〉：「『元亨利貞』為萬物宇宙之『始、_________、_________、成』。」", a: "長、遂。", tags: ["經典"] },
    { q: "264\n《心經》：「觀自在菩薩，行深般若波羅蜜多時，_________，_________。」", a: "照見五蘊皆空、度一切苦厄。", tags: ["經典"] },
    { q: "265\n《心經》：「舍利子，是諸法空相：_________，_________，_________。」", a: "不生不滅、不垢不淨、不增不減。", tags: ["經典"] },
    { q: "266\n《心經》：「菩提薩埵，依_________故，心無罣礙；無罣礙故，無有恐怖；遠離顛倒夢想，_________。」", a: "般若波羅蜜多、究竟涅槃。", tags: ["經典"] },
    { q: "267\n《心經》：「三世諸佛，依般若波羅蜜多故，得_________。」", a: "阿耨多羅三藐三菩提。", tags: ["經典"] },
    { q: "268\n佛規莊嚴是維繫道場穩固的基本力量，故推動基層道務應作好_________，遵守道場倫理，_________，謹守佛規。", a: "承上啟下、尊師重道。", tags: ["佛規"] },
    { q: "269\n推動基層道務，忠義字班及人才必須以身作則，發大心愿，有計畫的_________，_________。", a: "渡人、成全人。", tags: ["精神"] },
    { q: "270\n不休息菩薩慈訓〈忠義精神〉，應如何忠？\n忠於自己。忠於_________。忠於_________。忠於眾生。忠於祖師。", a: "天職、道場。", tags: ["精神"] },
    { q: "271\n在這末後一著，若不能認準金線，盲修瞎練，恐落個白修一場，所謂摸得著根的_________，摸不著根的_________。", a: "成佛祖、瞎修行。", tags: ["道義"] },
    { q: "272\n呂祖見黃龍禪師後頓悟玄旨，作何偈以明志？\n拋卻囊瓢擊碎琴，而今不煉汞中金，自從一見黃龍後，始覺當年_________。", a: "錯用心。", tags: ["道義"] },
    { q: "273\n為保證修道始終如一、永不退轉，應如何做？\n唯有追隨大道場，參辦區與佛堂的_________，才能確保真修真辦。", a: "道務運作。", tags: ["精神"] },
    { q: "274\n《六祖壇經．行由品第一》：大師告眾曰：「善知識！菩提自性，本來清淨，_________，_________。」", a: "但用此心、直了成佛。", tags: ["經典"] },
    { q: "275\n惠能初見五祖，祖問曰：「汝何方人，欲求何物？」惠能如何應對？", a: "惟求作佛，不求餘物。", tags: ["經典"] },
    { q: "276\n惠能三更受法，祖以袈裟遮圍，不令人見，為說《金剛經》，至「_________」，惠能言下大悟，……遂啟祖言：「何期自性，_________！何期自性，_________！何期自性，本自具足！何期自性，本無動搖！何期自性，能生萬法！」", a: "應無所住而生其心、本自清淨、本不生滅。", tags: ["經典"] },
    { q: "277\n《六祖壇經．般若品第二》：六祖云：「善知識！凡夫即佛，_________。前念迷即凡夫，_________；前念著境即煩惱，後念離境即菩提。」", a: "煩惱即菩提、後念悟即佛。", tags: ["經典"] },
    { q: "278\n《六祖壇經．坐禪品第五》：六祖云：「何名禪定？」外_________即禪，內_________即定。外禪內定，是為禪定。", a: "離相、不亂。", tags: ["經典"] },
    { q: "279\n《六祖壇經．懺悔品第六》：六祖云：「……先為傳自性五分法身香，次授……」，請問五分者為何？_________香。_________香。_________香。解脫香。解脫知見香。", a: "戒、定、慧。", tags: ["經典"] },
    { q: "280\n《六祖壇經．機緣品第七》中，有何三身？\n_________法身。_________報身。_________化身。", a: "清淨、圓滿、千百億。", tags: ["經典"] },
    { q: "281\n《六祖壇經．機緣品第七》中，有所謂「一宿覺」的禪師是指哪一位？", a: "永嘉大師。", tags: ["人物"] },
    { q: "282\n《六祖壇經．頓漸品第八》：師曰：「住心觀淨，是病非禪。常坐拘身，於理何益？聽吾偈曰：『生來坐不臥，_________；一具臭骨頭，_________？』」", a: "死去臥不坐、何為立功課。", tags: ["經典"] },
    { q: "283\n濟公活佛慈訓〈忠義鼎〉：「天不喪斯文，故有聖人出世，接續_________……而今大道普化世間，有_________承天景命，故鑄鼎以立，彰其道統；立鼎而信，天下傳之。……」", a: "道統真傳、發一崇德。", tags: ["精神"] },
    { q: "284\n濟公活佛慈訓〈鼎足〉「鼎有三足：一足為_________，一足為實務，一足為修持。……」，意即忠義鼎有三足，指的是哪三項？", a: "經訓。", tags: ["精神"] },
    { q: "285\n濟公活佛慈示忠義鼎內刻上哪一篇訓文？", a: "忠義精神。", tags: ["經典名字"] },
    { q: "286\n濟公活佛慈示於何處鑄忠義鼎？", a: "光慧。", tags: ["地點"] },
    { q: "287\n菩薩在人間行道的一個重要據點為何？", a: "佛堂。", tags: ["地點"] },
    { q: "288\n〈百孝經聖訓輯要〉：「夫孝，天之經也，地之義也，民之_________也。孝道乃為人之根本，本立道生，家和_________。」", a: "行、萬事興。", tags: ["經典"] },
    { q: "289\n《公孫丑上．第二章》，公孫丑曰：「敢問何謂浩然之氣？」孟子如何言答：「其為氣也，_________，以直養而無害，則塞於天地之間。」", a: "至大至剛。", tags: ["經典"] },
    { q: "290\n《公孫丑上．第二章》，孟子曰：「其為氣也，配_________；無是，餒也。是_________所生者，非義襲而取之也；行有_________，則餒矣。」", a: "義與道、集義、不慊於心。", tags: ["經典"] },
    { q: "291\n菩薩的本行是六度波羅蜜，內容為何？\n布施、_________、_________、_________、_________、_________。", a: "持戒、忍辱、精進、禪定、智慧。", tags: ["道義"] },
    { q: "292\n般若有三德，其內容為何？\n（1）文字般若。（2）_________般若。（3）_________般若。", a: "觀照、實相。", tags: ["道義"] },
    { q: "293\n忠義字班是道場一個縱向的行政組織，在忠義字班的架構下，所有道親，都應發揮_________的精神。", a: "守忠盡義。", tags: ["精神"] },
    { q: "294\n《談真錄〉〈第一部．心性問答錄〉，第八問、何處是心頭。佛經云：「佛在靈山莫遠求，靈山只在汝心頭；人人有個靈山塔，好向靈山塔下修。」十五代祖北海老人王祖覺一夫子所云，「心頭」為何意？\n心頭者，即_________也。", a: "心動之先。", tags: ["經典"] },
    { q: "295\n在配合班務促進道務中，學會渡人成人，讓自己成為師尊師母普渡三曹的以好幫手。深刻體認道之_________，講明求道的好處，以_________的心渡人，以身示道就是成全人的妙方。", a: "尊貴、赤誠。", tags: ["精神"] },
    { q: "296\n師尊說：「雖一人，緊繫多少_________。」所謂：「一子得道，九玄七祖都_________；一子成道，九玄七祖盡_________。」", a: "蒼生性命、沾光、超升。", tags: ["道義"] },
    { q: "297\n不休息菩薩慈訓〈三寶心法之殊勝〉：「三寶不輕傳，明師奉命_________；心法之真詮，_________慈無緣。」", a: "指玄關、同體大悲。", tags: ["道義"] },
    { q: "298\n設立佛堂，擔當天職，玄祖沾恩，師云：「〇〇佛堂今成立，天人共助一法船，_________。」", a: "九玄七祖一級晉。", tags: ["道義"] },
    { q: "299\n南屏道濟慈訓〈安設佛堂之殊勝〉：「安座設壇表，愿稟於　母娘。誠者安奉道，家家彌勒祥，佛光現滿屋，萬家昇佛光。此乃設壇之殊勝，_________免災殃。」", a: "躲劫避難。", tags: ["道義"] },
    { q: "300\n不休息菩薩慈訓〈傑出修士篇〉：「志為傑出修士，宜每日開卷，_________，探究妙理，參悟_________之教誨。」", a: "閱讀經訓、聖賢仙佛。", tags: ["精神"] },
    { q: "301\n不休息菩薩慈訓〈囑咐壇主〉：「壇主者，為_________身繫牽引_________之大任。」", a: "一舟之主、芸芸眾生。", tags: ["道義"] },
    { q: "302\n不休息菩薩慈訓〈囑咐壇主〉：「於聖業上_________，盡心盡力付出，以_________之誠懇。」", a: "真心真行、永保初發心。", tags: ["精神"] },
    { q: "303\n在《法華經．序品》中，彌勒菩薩請問_________以何因緣而有此瑞？", a: "文殊師利菩薩。", tags: ["人物"] },
    { q: "304\n《法華經．方便品》，諸佛世尊，唯_________故，出現於世。", a: "一大事因緣。", tags: ["經典"] },
    { q: "305\n《法華經．方便品》，何為一大事因緣？\n（1）_________佛知見。（2）_________佛知見。（3）_________佛知見。（4）_________佛知見。", a: "開、示、悟、入。", tags: ["道義"] },
    { q: "306\n《法華經．方便品》，佛告舍利弗：「如來但以_________故，為眾生說法，無有餘乘，若二、若三。舍利弗，一切十方諸佛，法亦如是。」", a: "一佛乘。", tags: ["經典"] },
    { q: "307\n在《法華經．序品》所謂的「權法」中，諸佛世尊以何法門渡化小乘、中乘、大乘弟子？\n「小乘：四聖諦法。中乘：十二因緣法。大乘：_________」", a: "六度波羅蜜。", tags: ["經典"] },
    { q: "308\n《中庸》云：「力行近乎仁，好學近乎知，知恥近乎勇」，學道的五種方法？\n_________學之，_________問之，_________思之，_________辨之，_________行之。", a: "博、審、慎、明、篤。", tags: ["經典"] },
    { q: "309\n《法華經．授學無學人記品》，釋迦牟尼佛與阿難於空王佛所時為師兄弟，何以釋迦牟尼已成佛，而阿難為佛前護法？", a: "因為佛常勤精進，阿難常樂多聞。", tags: ["經典"] },
    { q: "310\n濟公活佛慈訓〈辦學之殊勝〉：「教育的目的，在傳承文化之精髓；教育的使命，在教化來學之_________；教育的方向，在理論實務之實踐；教育的目標，在培養道場之_________。」", a: "重道、人才。", tags: ["道義"] },
    { q: "311\n何謂「阿耨多羅三藐三菩提」？\n就是「無上_________」。", a: "正等正覺。", tags: ["經典"] },
    { q: "312\n《法華經．法師品》佛告訴藥王菩薩，若有善男子善女人，於如來滅後，欲為四眾說是《法華經》者，應具足哪三個條件？\n「_________如來室、_________如來衣、_________如來座。」", a: "入、著、坐。", tags: ["經典"] },
    { q: "313\n《法華經．見寶塔品》，多寶佛塔以護持何經從地湧出？塔內為何佛尊？", a: "妙法蓮華經、多寶如來。", tags: ["經典名字"] },
    { q: "314\n《法華經．提婆達多品》，文殊菩薩告訴智積菩薩，是誰於海中修行，領悟《法華經》妙義，發菩提心而迅速成佛道？", a: "八歲龍女。", tags: ["人物"] },
    { q: "315\n釋迦牟尼佛前世曾是何菩薩？當告訴四眾：「我不敢輕於汝等。汝等皆當作佛。」其後依《法華經》成佛。", a: "常不輕菩薩。", tags: ["人物"] },
    { q: "316\n如是我聞。爾時，世尊食時，_________，入舍衛大城乞食。於其城中，次第乞已，_________。飯食訖，收衣鉢，洗足已，敷座而坐。（《金剛經．法會因由分第一》）", a: "著衣持鉢、還至本處。", tags: ["經典"] },
    { q: "317\n行道濟世走天涯，世輔匡、仁義化。醞智續命，行道要行到_________。", a: "三曹之了渡。", tags: ["道義"] },
    { q: "318\n道在_________之間，故應重視日常_________，舉凡行住坐臥，灑掃應對，待人處事，倫理綱常皆應_________。", a: "日用尋常、生活細節、合乎中道。", tags: ["道義"] },
    { q: "319\n衣著以端莊、樸實、整潔、美觀大方為要，衣應_________，褲、裙寬窄長度適中，鞋不要_________。", a: "有領有袖、前空後空。", tags: ["佛規"] },
    { q: "320\n執禮或上臺講道，應注意服裝儀容，乾道最好打_________，或穿_________，坤道最好勿著_________上臺、執禮。", a: "領帶、禮衣、長褲。", tags: ["佛規"] },
    { q: "321\n有關「承上」於身，應事前_________，事後_________。有功不貪功、不居功，乃前賢之德化；有過認罪，勇於改過。", a: "請示、回報。", tags: ["佛規"] },
    { q: "322\n南屏道濟慈訓〈崇德班〉：「崇德班程，_________；五科達成，成功修行；_________，普化世間也。」", a: "真辦真行、光芒照耀。", tags: ["精神"] },
    { q: "323\n不休息菩薩慈訓〈開道場的殊勝〉：「為道忘軀，無我無私，方開出崇德大道場。然天命正傳，正循道軌，為報答天恩師德，我崇德人當負起_________、繼往開來之使命；當_________，報答天恩。」", a: "承先啟後、立愿了愿。", tags: ["精神"] },
    { q: "324\n明師一指的真義為何？\n（1）辨明真妄，_________。（2）識自本心，見自本性。（3）打開_________。", a: "除妄顯真、生死門戶。", tags: ["道義"] },
    { q: "325\n口訣的真義為何？\n（1）_________的密語。（2）降伏_________的妙法。", a: "通天、妄心。", tags: ["道義"] },
    { q: "326\n《聖經》記載施洗者約翰說將來的那一位：「我現在用水給你們施洗，叫你們悔改；祂卻要用_________給你們施洗。」", a: "聖靈與火。", tags: ["道義"] },
    { q: "327\n禮記孟子告訴齊宣王，如何能夠達到天下運於掌？（《孟子．梁惠王篇（上）．第七章》）\n「老吾老以及_________，幼吾幼以及_________。」", a: "人之老、人之幼。", tags: ["經典"] },
    { q: "328\n開孟子曰：「養心莫善於_________。」（《孟子．梁惠王篇（下）．第三章》）", a: "寡欲。", tags: ["經典"] },
    { q: "329\n開孟子曰：「惟_________為能以大事小……；惟_________為能以小事大。……以大事小者，_________者也；以小事大者，_________者也。」（《孟子．梁惠王篇（下）．第三章》）", a: "仁者、智者、樂天、畏天。", tags: ["經典"] },
    { q: "330\n《孟子．公孫丑篇（上）．第二章》公孫丑曰：「敢問何謂浩然之氣？」孟子如何言答：「其為氣也，至大至剛，以_________，則塞於天地之間。」", a: "直養而無害。", tags: ["經典"] },
    { q: "331\n子貢問於孔子曰：「夫子聖矣乎？」孔子曰：「聖則吾不能，我_________也。", a: "學不厭而教不倦。", tags: ["經典"] },
    { q: "332\n孟子曰伯夷、伊尹、孔子皆是古之聖人，但孟子所願學誰？（《孟子．公孫丑篇（上）．第二章》）", a: "孔子。", tags: ["經典"] },
    { q: "333\n孟子曰：「人皆有四端也，猶其有四體也」，此四端為何？（《孟子．公孫丑篇（上）．第六章》）\n「_________之心，仁之端也；_________之心，羞惡之端也；_________之心，辭讓之端也；_________之心，智之端也。」", a: "惻隱、羞惡、辭讓、是非。", tags: ["經典"] },
    { q: "334\n滕文公為世子，將之楚，過宋而見孟子。孟子道_________，言必稱_________。（《孟子．滕文公篇（上）．第一章》）", a: "性善、堯舜。", tags: ["經典"] },
    { q: "335\n人倫關係有哪五種，內容為何？（《孟子．滕文公篇（上）．第四章》）", a: "父子有親，君臣有義，夫婦有別，長幼有序，朋友有信。", tags: ["經典"] },
    { q: "336\n孟子認為大丈夫面對富貴、貧賤、威武，應有何操守？（《孟子．滕文公篇（下）．第二章》）\n「_________不能淫，_________不能移，_________不能屈。」", a: "富貴、貧賤、威武。", tags: ["經典"] },
    { q: "337\n孟子曰：「夫_________，路也；_________，門也。惟君子能由是路，出入是門也。」（《孟子．萬章篇（下）．第七章》）", a: "義、禮。", tags: ["經典"] },
    { q: "338\n孟子曰：「哀哉！人有雞犬放，則知求之；有放心，而不知求。學問之道無他，_________而已矣。」（《孟子．告子篇（上）．第十一章》）", a: "求其放心。", tags: ["經典"] },
    { q: "339\n孟子曰：「_________者，知其性也；知其性，則知天矣！存其_________，養其_________，所以事天也。殀壽不貳，修身以俟之，所以立命也。」（《孟子．盡心篇（上）．第一章》）", a: "盡其心、心、性。", tags: ["經典"] },
    { q: "340\n孟子曰：「人之所_________，其良能也；所_________，其良知也。」（《孟子．盡心篇（上）．第十五章》）", a: "不學而能者、不慮而知者。", tags: ["經典"] },
    { q: "341\n公聽子問孟子。何以都是人，卻有大人與小人之別也？孟子如何回答？（《孟子．告子篇（上）．第十五章》）", a: "從其大體為大人，從其小體為小人。", tags: ["經典"] },
    { q: "342\n禮記孟子曰：「君子所性，_________根於心。其生色也，睟然見於面，盎於背，施於四體，四體不言而喻。」（《孟子．盡心篇（上）．第二十一章》）", a: "仁義禮智。", tags: ["經典"] },
    { q: "343\n辦道發爐時機，於開釋道義結束前約幾分鐘？", a: "十至十五。", tags: ["數字"] },
    { q: "344\n真正的逍遙要如至人無己，神人無功，聖人_________。（《莊子．逍遙遊》）", a: "無名。", tags: ["經典"] },
    { q: "345\n為何會有儒墨之是非，以是其所非而非其所是呢？（《莊子．齊物論》）", a: "道隱於小成，言隱於榮華。", tags: ["經典"] },
    { q: "346\n天下莫大於秋豪之末，而大山為小；莫壽於殤子，而彭祖為夭。天地與我並生，而_________。（《莊子．齊物論》）", a: "萬物與我為一。", tags: ["經典"] },
    { q: "347\n前人以大_________、大_________、大勇的精神，實踐慈悲喜捨的大行，奠定了成功的基石，立下了成功的典範。", a: "智、仁。", tags: ["精神"] },
    { q: "348\n恩師濟公活佛對我們崇德道場的發展指示了〈崇德大躍進〉的六大階段為何？\n「_________、_________、平均質量、人才培長、各區自強、任務接棒。」", a: "固本圖強、提升質量。", tags: ["精神"] },
    { q: "349\n恩師慈示〈鼎足〉，經訓、_________、_________、此三足定，天下可定，道程可穩，道務永續。", a: "實務、修持。", tags: ["精神"] },
    { q: "350\n感恩道場在我們進入德字班以後提拔為_________或_________。", a: "副壇主、壇主。", tags: ["班程"] },
    { q: "351\n師尊在〈萬世金鐘〉訓文慈示，何謂音、樂與鐘風？\n音者，生於_________。樂者，通於_________。鐘風者，為之_________，為引導眾生修身立德行道也。", a: "人心、倫理、宗風。", tags: ["道義"] },
    { q: "352\n萬世金鐘的鐘身刻的是哪篇文章？", a: "道之宗旨。", tags: ["經典名字"] },
    { q: "353\n萬世金鐘的鐘體內刻的是哪部經？", a: "彌勒救苦真經。", tags: ["經典名字"] },
    { q: "354\n忠義鼎與萬世金鐘皆為　老母所賜的白陽鎮寶，最重要是印證甚麼？\n印證發一崇德乃「_________、_________」，故能弘揚正法以渡化眾生。", a: "天命正脈、道統正傳。", tags: ["精神"] },
    { q: "355\n張良出家修行詩：「多言_________，惡被_________；富遭嫉妒貧遭賤，算來自然合天機。……」", a: "人嫌少言痴、人厭善被欺。", tags: ["經典"] },
    { q: "356\n三寶中的玄關竅，其意義為何？\n（1）是生命的樞紐。（2）_________。（3）心的源頭。（4）成聖佛的心法。", a: "靈性的正門。", tags: ["道義"] },
    { q: "357\n三寶的妙用？\n第一寶玄關竅，可用來_________，可以收攝我們的身心。\n第二寶口訣，可默念五字真言，_________。\n第三寶合同，可拳拳服膺，以心印心。", a: "守玄、淨化我們的心靈。", tags: ["道義"] },
    { q: "358\n開首偈語是在形容功功德費的重要性，內容為何？\n「佛家一文錢，大似_________，侵吞_________，_________還。」", a: "須彌山、無實報、披毛帶角。", tags: ["經典"] },
    { q: "359\n濟公活佛慈訓〈法會之勝境〉：「焚表，愿立訴於諸佛；表_________，始終如一，_________。」", a: "以此發心、建功立德。", tags: ["精神"] },
    { q: "360\n清朝順治皇帝感慨說：「來時糊塗_________，空在人間走一回，未曾生我_________，生我之後_________，長大成人方知我，合眼矇矓_________，不如不來亦不去，亦無煩惱亦無悲。」", a: "去時迷、誰是我、我是誰、又是誰。", tags: ["經典"] },
    { q: "361\n為什麼要求道？\n（1）探討_________。（2）尋找真我及靈性的歸宿。（3）_________，變化氣質。（4）開啟智慧，安頓身心。（5）歷代聖賢仙佛也要拜明師求大道。", a: "人生真諦、改變命運。", tags: ["道義"] },
    { q: "362\n神光二祖為何要拜達摩祖師為師？\n因為_________，_________。_________，_________。", a: "不知到底一歸何、是以神光拜達摩、立雪少林焦點、只求一指躲閻羅。", tags: ["經典"] },
    { q: "363\n道是聖聖相傳的性理心法，三教怎麼說？\n儒曰執中_________。釋曰萬法_________。道曰抱元_________。", a: "貫一、歸一、守一。", tags: ["道義"] },
    { q: "364\n古聖堯、舜、禹天命傳承，有十六字心法，內容為何？\n人心_________、道心_________、惟精_________、允執_________。", a: "惟危、惟微、惟一、厥中。", tags: ["經典"] },
    { q: "365\n古今修道者得道之因緣有何差別？", a: "古時先修後得，今時先得後修。", tags: ["道義"] },
    { q: "366\n民國八十五年（一九九六）精神指標有修道四門功課，內容為何？\n「修道_________驗當先，再培功德立志前；火候煉足性光現，_________法聖賢。」", a: "品格、博文約禮。", tags: ["精神"] },
    { q: "367\n點傳師參駕完畢，操持者帶大家_________。", a: "接駕。", tags: ["佛規"] },
    { q: "368\n壇主對道務開創的具體做法為何？\n（1）積極參與_________，共商道務發展計劃。（2）盡力廣行三施，護持道務發展。（3）每月渡人_________，對本壇道務積極參與。（4）配合大道場脈動，貫徹前人修辦理念與精神。", a: "壇主會議、求道。", tags: ["道義"] },
    { q: "369\n身為壇主，本身應熟悉_________，及一切辦道準備工作及操持。才能正己成人，培養佛堂良好的風氣。", a: "佛規禮節。", tags: ["道義"] },
    { q: "370\n《路加福音．第十四章》耶穌：「凡不背著_________跟從我的，不能作我的門徒。」", a: "自己的十字架。", tags: ["經典"] },
    { q: "371\n古德云：「讀破千經萬典，不如_________。」又云：「玄關竅，蓬萊島，點開就是_________。」", a: "明師一點、無價寶。", tags: ["經典"] },
    { q: "372\n要聖凡並進，須_________，才能與聖業_________：凡不違背修道、行道，不影響聖業的才叫正業。", a: "選擇正業、相輔相成。", tags: ["精神"] },
    { q: "373\n無論在聖業或凡業，若能抱持_________、_________的心態，其結果反而讓人驚奇，收穫怎麼這麼多。", a: "歡喜做、甘願受。", tags: ["精神"] },
    { q: "374\n活佛老師說：「人生最大的敵人是_________。」", a: "自己。", tags: ["道義"] },
    { q: "375\n辦道時要_________、心甘情願_________、充滿喜悅。", a: "無怨無悔、真心付出。", tags: ["精神"] },
    { q: "376\n善男子、善女人，發阿耨多羅三藐三菩提心，云何應住？云何降伏其心？\n應_________住，_________降伏其心。（《金剛經．善現啟信分第二》）", a: "如是、如是。", tags: ["經典"] },
    { q: "377\n佛告須菩提，若菩薩有哪四相即非菩薩？（《金剛經．大乘正宗分第三》）", a: "我相、人相、眾生相、壽者相。", tags: ["經典"] },
    { q: "378\n諸菩薩摩訶薩，應如是生清淨心，不應住色生心，不應住聲、香、味、觸、法生心，應如何生其心？（《金剛經．莊嚴淨土分第十》）", a: "應無所住而生其心。", tags: ["經典"] },
    { q: "379\n《金剛經．究竟無我分第十七》中，哪位佛於過去世授記世尊，於來世當成佛，號釋迦牟尼佛？", a: "燃燈佛。", tags: ["人物"] },
    { q: "380\n《金剛經．一體同觀分第十八》中，如來有哪五眼？", a: "肉眼、天眼、慧眼、法眼、佛眼。", tags: ["經典"] },
    { q: "381\n《金剛經．一體同觀分第十八》中，如來說諸心，皆為非心，是名為心。所以者何？\n「_________心不可得，_________心不可得，_________心不可得。」", a: "過去、現在、未來。", tags: ["經典"] },
    { q: "382\n須菩提白佛言：世尊！如我解佛所說義，不應以三十二相觀如來。爾時，世尊而說偈言，以哪四句偈作說明？（《金剛經．法身非相分第二十六》）\n「若以_________見我，以_________求我，是人行邪道，不能見如來。」", a: "色、音聲。", tags: ["經典"] },
    { q: "383\n須菩提！若有人言：如來若來、若去；若坐、若臥。是人不解我所說義，何以故？（《金剛經．威儀寂靜分第二十九》）", a: "如來者，無所從來，亦無所去，故名如來。", tags: ["經典"] },
    { q: "384\n如來所說三千大千世界，即非世界，是名世界。何以故？若世界實有者，即是甚麼？（《金剛經．一合理相分第三十》）", a: "一合相。", tags: ["經典"] },
    { q: "385\n傳統有為法，如_________，_________，應作如是觀。（《金剛經．應化非真分第三十二》）", a: "夢幻泡影、如露亦如電。", tags: ["經典"] },
    { q: "386\n發一崇德於二〇一一年四月十六日、五月六日、七月十四日，不休息菩薩得到　老母恩賜有「三爐三會」的召開，會中特別指示：_________是發一崇德最高統御單位，是集體共同接續不休息菩薩的_________，也是最高的集體領導群。", a: "崇德負責群、道棒繼承。", tags: ["精神"] },
    { q: "387\n於三爐三會後，七月十五日農曆夏季大典，　老母慈悲臨壇確定任命_________，正式啟動永續聖業，薪火傳承的神聖任務，專責負起提拔_________之責任。", a: "天命保管群、最高天職。", tags: ["班程"] },
    { q: "388\n前人慈悲：如何態度最能動人？", a: "心誠、氣和、色溫、辭婉。", tags: ["道義"] },
    { q: "389\n道與教之分別，從宗旨上來說：道是直指人心，_________，屬頓悟之法。教是教化，目的在_________、化稟性，返樸歸真，屬漸修之法。", a: "見性成佛、去物欲。", tags: ["道義"] },
    { q: "390\n五祖云：「汝等終日_________，不求出離_________，自性若迷，福何可救？」", a: "只求福田、生死苦海。", tags: ["經典"] },
    { q: "391\n南屏道濟慈訓〈講培班〉：「講培者乃是培育_________之人才。班程開設講培班，_________步理域。」", a: "講道宣揚聖理、希賢希聖。", tags: ["精神"] },
    { q: "392\n濟公活佛慈訓：「『人才』與『先天人才』又有何不同呢？徒兒們可知？『人才』是可以用方法來培養，但是可能因個人的凡俗念頭而改變。然而，『先天人才』是有著_________，有著先天的大愿，因不忍眾生苦而降世，因不忍眾生於水火當中而伸出援助，……因知道道場乃是成就_________的佛所，因而降來此佛門。」", a: "先天的使命、聖賢仙佛。", tags: ["精神"] },
    { q: "393\n〈道脈傳承錄〉訓文的本訓是由哪幾位仙佛所批？", a: "達摩祖師、北海老人、濟公活佛、中華聖母。", tags: ["多人物"] },
    { q: "394\n第三篇〈竹圖訓〉的法會，遇到哪個天災？", a: "印尼亞齊大地震、南亞大海嘯。", tags: ["地點"] },
    { q: "395\n哪一代祖師開始辦理收圓？", a: "第十五代王祖覺一。", tags: ["人物"] },
    { q: "396\n開始傳禮本的是哪一位祖師？禮本從何而來？", a: "黃九祖、上天所賜。", tags: ["人物"] },
    { q: "397\n儒起釋終，祖師降火宅，起自哪一代祖師？", a: "後東方第七代，白祖、馬祖。", tags: ["多人物"] },
    { q: "398\n北海老人是哪一位祖師？", a: "第十五代王祖覺一。", tags: ["人物"] },
    { q: "399\n白陽初祖是誰？", a: "第十七代路祖中一。", tags: ["人物"] },
    { q: "400\n白陽期有幾代祖師？總共多少年？", a: "兩代祖師、一萬零八百年。", tags: ["人物"] }
    ];

    let gameMode = null; 
    let totalQuestionsSetting = null; 
    let bonusMode = null; // 'unvisited' (優先未出題), 'review' (錯題複習), null
    let currentQuestions = []; 
    let currentIdx = 0;
    let scoreCorrect = 0;
    let playerHistory = []; 
    let isTransitioning = false; 

    window.onload = function() {
        initProgressHistory();
        checkLocalStorageStatus();
        updateMenuUI();
        renderDashboardData();
    };

    function initProgressHistory() {
        if (!localStorage.getItem('修辦津要_通關軌跡')) {
            localStorage.setItem('修辦津要_通關軌跡', JSON.stringify({}));
        }
    }
    function getProgressMap() {
        return JSON.parse(localStorage.getItem('修辦津要_通關軌跡') || '{}');
    }
    function saveProgress(qText, state) {
        let map = getProgressMap();
        map[qText] = state; 
        localStorage.setItem('修辦津要_通關軌跡', JSON.stringify(map));
    }

    function getStoredWrongQuestions() {
        let stored = localStorage.getItem('修辦津要_錯題本');
        return stored ? JSON.parse(stored) : [];
    }

    // 完美修正：檢查錯題本數量，更新加成按鈕與聯動邏輯
    function checkLocalStorageStatus() {
        let wrongList = getStoredWrongQuestions();
        const reviewBtn = document.getElementById('bonus-review');
        
        let validWrongCount = wrongList.filter(wText => {
            let cleanWrongText = wText.replace(/^\d+\n/g, "").trim();
            return rawQuestionBank.some(item => {
                let cleanBankQ = item.q.replace(/^\d+\n/g, "").trim();
                return cleanBankQ === cleanWrongText || item.q === wText;
            });
        }).length;

        reviewBtn.innerText = `錯題複習 (${validWrongCount}題)`;
        
        if (validWrongCount === 0) {
            reviewBtn.disabled = true; // 1. 若0題則自動關閉該按鈕不可互動
            if (bonusMode === 'review') {
                bonusMode = null;
            }
        } else {
            reviewBtn.disabled = false;
        }
    }

    function renderDashboardData() {
        const ratioText = document.getElementById('db-ratio');
        const barInner = document.getElementById('db-progress-bar');
        
        let progressMap = getProgressMap();
        let totalCount = rawQuestionBank.length;
        let visitedCount = 0;

        rawQuestionBank.forEach(item => {
            if (progressMap[item.q] === 'correct' || progressMap[item.q] === 'wrong') {
                visitedCount++;
            }
        });

        let percent = totalCount > 0 ? Math.round((visitedCount / totalCount) * 100) : 0;
        ratioText.innerText = `已挑戰: ${visitedCount} / ${totalCount} 題 (${percent}%)`;
        barInner.style.width = `${percent}%`;
    }

    function selectMode(mode) { 
        if(isTransitioning) return; 
        // 當勾選錯題複習時，不可選擇模式
        if (bonusMode === 'review') return;
        gameMode = mode; 
        updateMenuUI(); 
    }
    
    function selectCount(num) { 
        if(isTransitioning) return; 
        totalQuestionsSetting = num; 
        updateMenuUI(); 
    }

    // 全新加成開關切換邏輯與模式鎖定聯動
    function selectBonus(bonusType) {
        if(isTransitioning) return;
        if (bonusMode === bonusType) {
            bonusMode = null; // 取消勾選
        } else {
            bonusMode = bonusType;
            // 2. 點擊錯題複習，自動勾選填空題
            if (bonusMode === 'review') {
                gameMode = 'fill'; 
            }
        }
        checkLocalStorageStatus();
        updateMenuUI();
    }
    
    function updateMenuUI() {
        const choiceModeBtn = document.getElementById('mode-choice');
        const fillModeBtn = document.getElementById('mode-fill');

        // 重置所有按鈕樣式
        choiceModeBtn.classList.remove('selected-btn');
        fillModeBtn.classList.remove('selected-btn');
        document.getElementById('num-15').classList.remove('selected-btn');
        document.getElementById('num-30').classList.remove('selected-btn');
        document.getElementById('num-50').classList.remove('selected-btn');
        
        document.getElementById('bonus-unvisited').classList.remove('selected-bonus-btn');
        document.getElementById('bonus-review').classList.remove('selected-bonus-btn');

        // 聯動控管：點擊錯題複習時，不可選擇選擇題（禁用按鈕）
        if (bonusMode === 'review') {
            choiceModeBtn.disabled = true;
        } else {
            choiceModeBtn.disabled = false;
        }

        if (gameMode === 'choice') choiceModeBtn.classList.add('selected-btn');
        if (gameMode === 'fill') fillModeBtn.classList.add('selected-btn');
        
        if (totalQuestionsSetting === 15) document.getElementById('num-15').classList.add('selected-btn');
        if (totalQuestionsSetting === 30) document.getElementById('num-30').classList.add('selected-btn');
        if (totalQuestionsSetting === 50) document.getElementById('num-50').classList.add('selected-btn');

        if (bonusMode === 'unvisited') document.getElementById('bonus-unvisited').classList.add('selected-bonus-btn');
        if (bonusMode === 'review') document.getElementById('bonus-review').classList.add('selected-bonus-btn');
    }

    function startGame() {
        if (!gameMode) { alert("請先選擇【 測驗模式 】"); return; }
        if (!totalQuestionsSetting) { alert("請先選擇【 選擇題數 】"); return; }

        let progressMap = getProgressMap();
        let pool = [];

        if (bonusMode === 'review') {
            let wrongTexts = getStoredWrongQuestions();
            pool = rawQuestionBank.filter(item => {
                let cleanBankQ = item.q.replace(/^\d+\n/g, "").trim();
                return wrongTexts.some(wText => {
                    let cleanWrongText = wText.replace(/^\d+\n/g, "").trim();
                    return cleanBankQ === cleanWrongText || item.q === wText;
                });
            });
            if (pool.length === 0) {
                alert("您目前沒有錯題資料，將為您切換為常規抽題。");
                pool = [...rawQuestionBank];
                bonusMode = null;
                updateMenuUI();
            }
        } 
        else if (bonusMode === 'unvisited') {
            pool = rawQuestionBank.filter(item => !progressMap[item.q]);
            if (pool.length === 0) {
                alert("恭喜！所有考題皆已挑戰過一輪！將為您切換為全題庫抽題。");
                pool = [...rawQuestionBank];
                bonusMode = null;
                updateMenuUI();
            }
        } 
        else {
            pool = [...rawQuestionBank];
        }

        let shuffled = pool.sort(() => 0.5 - Math.random());
        let finalCount = Math.min(totalQuestionsSetting, shuffled.length); 
        currentQuestions = shuffled.slice(0, finalCount);

        currentIdx = 0;
        scoreCorrect = 0;
        playerHistory = [];
        isTransitioning = false;

        switchScreen('screen-game');
        
        let titleText = gameMode === 'choice' ? '選擇題模式' : '填空題模式';
        if (bonusMode === 'unvisited') titleText += ' + 優先未出';
        if (bonusMode === 'review') titleText += ' + 錯題複習';
        document.getElementById('game-title').innerText = titleText;
        
        showQuestion();
    }

    function showQuestion() {
        if (currentIdx >= currentQuestions.length) {
            endGame();
            return;
        }

        const qData = currentQuestions[currentIdx];
        document.getElementById('question-number').innerText = `第 ${currentIdx + 1} / ${currentQuestions.length} 題`;
        document.getElementById('progress-indicator').style.width = `${(currentIdx / currentQuestions.length) * 100}%`;
        document.getElementById('question-text').innerText = qData.q;

        if (gameMode === 'choice') {
            document.getElementById('area-choice').style.display = 'block';
            document.getElementById('area-fill').style.display = 'none';
            
            let options = generateSmartOptions(qData);
            for(let i = 0; i < 4; i++) {
                let btn = document.getElementById(`opt-${i}`);
                btn.innerText = options[i] || "以上皆非";
                btn.dataset.ans = options[i] || "以上皆非";
                
                btn.className = 'option-btn'; 
                btn.style.backgroundColor = ""; 
                btn.style.color = "";
                btn.style.borderColor = "";
                btn.style.borderBottom = "";
            }
        } else {
            document.getElementById('area-choice').style.display = 'none';
            document.getElementById('area-fill').style.display = 'block';
            document.getElementById('fill-input').value = '';
            document.getElementById('fill-input').focus();
        }
    }

    function generateSmartOptions(currentQData) {
        let correctAns = currentQData.a;
        let currentTags = currentQData.tags || [];

        // 1. 嚴格篩選：撈出標籤相同、且答案不同的題目
        let targetedPool = rawQuestionBank.filter(item => {
            if (item.a === correctAns) return false;
            let itemTags = item.tags || [];
            return currentTags.some(t => itemTags.includes(t));
        });

        // 2. 轉成不重複的答案陣列，並隨機打亂
        let wrongAnswers = [...new Set(targetedPool.map(item => item.a))];
        wrongAnswers.sort(() => 0.5 - Math.random());
    
        // 取出前三個錯誤答案
        let selectedWrong = wrongAnswers.slice(0, 3);

        // 3. 【核心修正】如果同標籤的答案不夠 3 個，才去全題庫撈其他答案補齊
        if (selectedWrong.length < 3) {
            let allPool = rawQuestionBank
                .filter(item => item.a !== correctAns)
                .map(item => item.a);
        
            let uniqueAllPool = [...new Set(allPool)].sort(() => 0.5 - Math.random());

            for (let f of uniqueAllPool) {
                if (selectedWrong.length >= 3) break;
                if (!selectedWrong.includes(f)) {
                    selectedWrong.push(f);
                }
            }
        }

        // 4. 如果連全題庫都不夠（極少見），再用固定填充字串
        if (selectedWrong.length < 3) {
            let fillers = ["家壇、公壇。", "學道、修道、講道、辦道。", "無極理天。"];
            fillers.forEach(f => {
                if (selectedWrong.length < 3 && f !== correctAns && !selectedWrong.includes(f)) {
                    selectedWrong.push(f);
                }
            });
        }
        while (selectedWrong.length < 3) {
            selectedWrong.push("以上皆非");
        }

        let finalOptions = [correctAns, ...selectedWrong];
        return finalOptions.sort(() => 0.5 - Math.random());
    }
    function submitChoice(index) {
        if(isTransitioning) return; 
        document.activeElement.blur();
        let btn = document.getElementById(`opt-${index}`);
        checkAnswer(btn.dataset.ans, currentQuestions[currentIdx].a, index);
    }

    function submitFill() {
        if(isTransitioning) return;
        const pAns = document.getElementById('fill-input').value.trim();
        if(pAns === "") { alert("請先輸入答案！"); return; }
        checkAnswer(pAns, currentQuestions[currentIdx].a);
    }

    function checkAnswer(playerAns, currentCorrectAns, choiceIndex = null) {
        isTransitioning = true;

        function normalizeText(text) {
            let clean = text.replace(/[。，、；：：？?.,;: \s（）()]/g, "");

            const chineseNumRegex = /[一二三四五六七八九十百千萬兩〇零]+/g;
            clean = clean.replace(chineseNumRegex, function(match) {
                if (match === '零' || match === '〇') return match;
                
                let val = 0;
                let temp = 0;
                const cMap = { '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '兩':2, '十':10, '百':100, '千':1000, '萬':10000, '零':0, '〇':0 };
                
                for (let i = 0; i < match.length; i++) {
                    let cn = match[i];
                    let num = cMap[cn];
                    if (num === undefined) continue;
                    
                    if (num === 10 || num === 100 || num === 1000) {
                        if (temp === 0) temp = 1; 
                        val += temp * num;
                        temp = 0;
                    } else if (num === 10000) {
                        val += temp;
                        val *= 10000;
                        temp = 0;
                    } else {
                        temp = num;
                    }
                }
                val += temp;
                return val.toString();
            });

            const map = { '一': '1', '二': '2', '三': '3', '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9', '〇': '0', '零': '0', '兩': '2' };
            for (let key in map) {
                clean = clean.split(key).join(map[key]);
            }
            return clean;
        }

        let cleanPlayer = normalizeText(playerAns);
        let standardized = normalizeText(currentCorrectAns);
        
        let isCorrect = false;
        if (gameMode === 'choice') {
            isCorrect = (playerAns === currentCorrectAns);
        } else {
            let keywords = currentCorrectAns.split(/[,，、]/).filter(w => w.length > 0);
            isCorrect = keywords.every(kw => cleanPlayer.includes(normalizeText(kw)));
        }

        let currentQuestionText = currentQuestions[currentIdx].q;
        let wrongList = getStoredWrongQuestions();

        if (isCorrect) {
            scoreCorrect++;
            saveProgress(currentQuestionText, 'correct');
            wrongList = wrongList.filter(qText => qText !== currentQuestionText);
        } else {
            saveProgress(currentQuestionText, 'wrong');
            if (!wrongList.includes(currentQuestionText)) wrongList.push(currentQuestionText);
        }
        localStorage.setItem('修辦津要_錯題本', JSON.stringify(wrongList));

        playerHistory.push({ q: currentQuestionText, pAns: playerAns, cAns: currentCorrectAns, isCorrect: isCorrect });

        const container = document.getElementById('main-container');
        if (gameMode === 'choice' && choiceIndex !== null) {
            document.getElementById(`opt-${choiceIndex}`).style.backgroundColor = isCorrect ? "#4a5d4c" : "#a63232";
            document.getElementById(`opt-${choiceIndex}`).style.color = "#ffffff";
        }

        container.style.outlineColor = isCorrect ? "#4a5d4c" : "#a63232";
        if (!isCorrect) container.classList.add('shake-effect');

        setTimeout(() => {
            container.style.outlineColor = "#8c2626"; 
            container.classList.remove('shake-effect');
            isTransitioning = false; 
            currentIdx++;
            showQuestion();
        }, 600);
    }

    function endGame() {
        switchScreen('screen-result');
        let total = currentQuestions.length;
        document.getElementById('result-score').innerText = `本次共測試 ${total} 題 ｜ 正確：${scoreCorrect} 題 ｜ 錯誤：${total - scoreCorrect} 題`;
        renderReviewList();
    }

    function renderReviewList(filter = 'all') {
        const listEl = document.getElementById('review-list');
        listEl.innerHTML = '';
        playerHistory.forEach((item, idx) => {
            if (filter === 'wrong' && item.isCorrect) return;
            const div = document.createElement('div');
            div.className = `review-item ${item.isCorrect ? 'correct-item' : 'wrong-item'}`;
            div.innerHTML = `<strong>第 ${idx+1} 題：</strong><br><span style="white-space: pre-line;">${item.q}</span><br>
                             <span>【 你的答案 】：${item.pAns || '（未填）'} ｜ 【 正確答案 】：${item.cAns} (${item.isCorrect ? '✓ 正確' : '✗ 錯誤'})</span>`;
            listEl.appendChild(div);
        });
    }

    function filterReview(type) {
        document.getElementById('filter-all').classList.toggle('active-filter', type === 'all');
        document.getElementById('filter-wrong').classList.toggle('active-filter', type === 'wrong');
        renderReviewList(type);
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goToInspectPage() {
        if(isTransitioning) return;
        switchScreen('screen-inspect');
        buildInspectDotsGrid(); 
        renderInspectAllQuestionsList();
    }

    function leaveInspectPage() {
        if(isTransitioning) return;
        checkLocalStorageStatus();
        renderDashboardData();
        switchScreen('screen-main');
    }

    function buildInspectDotsGrid() {
        const gridContainer = document.getElementById('inspect-dots-container');
        gridContainer.innerHTML = '';
        let progressMap = getProgressMap();

        rawQuestionBank.forEach((item, idx) => {
            const dot = document.createElement('div');
            dot.className = 'grid-dot';
            dot.title = `第 ${idx+1} 題:\n${item.q.substring(0, 45)}...`;
            dot.innerText = idx + 1;

            let state = progressMap[item.q];
            if (state === 'correct') dot.classList.add('dot-correct');
            else if (state === 'wrong') dot.classList.add('dot-wrong');
            else dot.classList.add('dot-unvisited');

            dot.onclick = function() {
                const targetCard = document.getElementById(`inspect-card-${idx}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetCard.style.backgroundColor = "#fff9ea";
                    setTimeout(() => { targetCard.style.backgroundColor = "#ffffff"; }, 1000);
                }
            };
            gridContainer.appendChild(dot);
        });
    }

    function renderInspectAllQuestionsList() {
        const listEl = document.getElementById('inspect-scroll-list');
        listEl.innerHTML = '';
        let progressMap = getProgressMap();

        rawQuestionBank.forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = 'inspect-card';
            card.id = `inspect-card-${idx}`;

            let state = progressMap[item.q];
            if (state === 'correct') card.classList.add('card-correct');
            else if (state === 'wrong') card.classList.add('card-wrong');
            else card.classList.add('card-unvisited');

            card.innerHTML = `
                <div style="font-weight: bold; color: #8c2626; margin-bottom: 4px;">第 ${idx + 1} 題</div>
                <div style="white-space: pre-line; color: #2a201b; font-weight: 500;">${item.q.replace(/^\d+\n/g, "")}</div>
                <div class="inspect-answer-zone">【答案】：${item.a}</div>
            `;
            listEl.appendChild(card);
        });
    }

    function restartGame() { 
        if(isTransitioning) return;
        gameMode = null;
        totalQuestionsSetting = null;
        bonusMode = null;
        checkLocalStorageStatus(); 
        updateMenuUI();
        renderDashboardData();
        switchScreen('screen-main'); 
    }
</script></body>
